#cloud-config
# Gateway 是純 Gateway：cloud-init 只負責「開機後能被 ssh 進來」。
# sshd 硬化、fail2ban ignoreip、runtime 安裝一律交給 provision.sh
# （docs/POOL_RUNTIME_SPEC.md §9.2），不要在這裡加。

users:
  - name: fatesaikou
    groups: sudo
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    shell: /bin/bash
    lock_passwd: true
    ssh_authorized_keys:
      - ${FATESAIKOU_PUBKEYS}
  - name: sshproxy
    shell: /bin/bash
    lock_passwd: true
    ssh_authorized_keys:
      - ${SSHPROXY_PUBKEYS}

# 純金鑰認證：不設密碼，公鑰由 rotate workflow 渲染進來（見上方佔位符）。
# 佔位符是「單一序列項目」的合法形狀；rotate_render_cloud_config 把值
# 展開成多行——第一行承接模板的 `      - `，其餘行在值內自帶縮排，
# 於是多把公鑰會展開成多個序列項目（ssh_authorized_keys 是陣列）。
ssh_pwauth: false

package_update: true
# 不 upgrade：285 天沒重建的舊機正是因為累積更新債才出事，但在 cloud-init
# 階段 upgrade 會拖長 rotate 且可能中途失敗。新機用的是最新 image，本來就
# 不需要。
package_upgrade: false

packages:
  - curl
  - ca-certificates
  - git
  - jq
  - netcat-openbsd
  - util-linux
  - iproute2
  - fail2ban
