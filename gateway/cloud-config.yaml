#cloud-config
users:
- name: fatesaikou
  groups: sudo
  sudo: ALL=(ALL) NOPASSWD:ALL
  shell: /bin/bash
  lock_passwd: false
  plain_text_passwd: ${FATESAIKOU_TMP_PASS}
- name: sshproxy
  shell: /bin/bash
  lock_passwd: false
  plain_text_passwd: ${SSHPROXY_PASS}

package_update: true
package_upgrade: true

packages:
- gcc
- make
- curl
- unzip
- vim
- tmux
- git
- rclone
- python3
- python3-pip
- python3-ipython
- nodejs
- grc
