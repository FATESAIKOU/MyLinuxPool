name: Refresh Authorized Keys

# spec: docs/KEY-DESIGN.md §5 — reassemble the Gateway's two
# authorized_keys from the repo variables and install them. This is the
# narrow refresh that register-client / register-provider / create-worker
# dispatch after changing CLIENT_* / NODE_* / POOL_WORKERS; it only
# rewrites the two key files, it never provisions.
#
# A THIN CALLER (docs/LAYOUT.md §3): all decision-making lives in
# scripts/refresh-authkeys.sh, scripts/lib/authkeys.sh and
# scripts/rotate-gateway.sh — this file only fetches variables via gh api,
# calls the functions, and hands the resulting command string to pool-ssh.
#
# ONE assembly path, never two: the sshproxy list is built by
# rotate_assemble_sshproxy_keys, the SAME function task S / rotate uses.
# 2026-09-16 incident: this workflow had its own copy of the tunnel-list
# logic that assembled ONLY the per-machine tunnel_public_key values —
# when fh-l self-generated its key and dispatched this workflow, the
# Gateway's sshproxy authorized_keys was overwritten with just fh-l's key
# and the SHARED key (the only key fh-proxy had) was wiped. fh-proxy has
# no remote fallback; a tunnel restart would have lost it permanently.
# That function carries the MIGRATION.md §2 guard — the shared key must be
# in the result or it refuses — so this path is safe only BECAUSE it goes
# through it. Do not fork the assembly logic here again.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GH_TOKEN: ${{ secrets.GH_POOL_TOKEN }}
  GH_REPO: ${{ github.repository }}
  # Every NODE_* hop's key_secret points at this one Actions identity
  # (docs/ARCHITECTURE.md §3) — pool-ssh's agent only ever needs this
  # single key regardless of which chain it resolves.
  SSH_KEY_ACTIONS: ${{ secrets.SSH_KEY_ACTIONS }}
  # Used to decrypt the shared tunnel key (MIGRATION.md §2: it stays in
  # the fleet's sshproxy list until KEY-DESIGN §8).
  FILE_CRYPTO_KEY: ${{ secrets.FILE_CRYPTO_KEY }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble both authorized_keys lists and build install commands
        id: assemble
        shell: bash
        run: |
          set -euo pipefail
          source scripts/refresh-authkeys.sh
          source scripts/lib/authkeys.sh
          # rotate_assemble_sshproxy_keys lives in the rotate business
          # logic — ONE assembly path for both flows (see the incident
          # note at the top of this file).
          source scripts/rotate-gateway.sh

          vars_json="$(gh api "repos/${GH_REPO}/actions/variables?per_page=100" --paginate)"
          workers_json="$(gh api "repos/${GH_REPO}/actions/variables/POOL_WORKERS" --jq .value 2>/dev/null || echo '[]')"

          # ---- login list -------------------------------------------------
          clients="$(refresh_collect_clients "$vars_json")"
          # §6 self-lockout guard: authkeys_assemble needs the Actions key
          # as required_pubkey and refuses (non-zero, no output) when it is
          # missing from the result. A failure here aborts the whole run —
          # a partial or Actions-less list must never reach the Gateway.
          actions_pk="$(printf '%s' "$clients" | jq -r '.[] | select(.name == "actions") | .public_key // empty' 2>/dev/null || true)"
          if [[ -z "$actions_pk" ]]; then
            echo "::error::no CLIENT_ACTIONS public_key found — cannot assemble a login list that provably keeps Actions in. Refusing to touch the Gateway."
            exit 1
          fi
          login="$(authkeys_assemble "$clients" "$actions_pk")" || {
            echo "::error::login list assembly failed (see authkeys.sh stderr) — aborting without touching the Gateway"
            exit 1
          }
          login_count="$(printf '%s\n' "$login" | wc -l | tr -d ' ')"
          echo "login_count=${login_count}" >> "$GITHUB_OUTPUT"
          # refresh_build_install_cmd output is already a single-line
          # string (base64 without newlines inside) — safe for $GITHUB_OUTPUT.
          echo "login_cmd=$(refresh_build_install_cmd /home/fatesaikou/.ssh/authorized_keys "$login")" >> "$GITHUB_OUTPUT"
          echo "assembled ${login_count} login key(s) from CLIENT_*"

          # ---- tunnel list ------------------------------------------------
          # The sshproxy list = the SHARED key (decrypted from
          # ssh-tunnel-server's encrypted file — it is every provider's
          # dial-in identity during the migration) UNION all per-machine
          # tunnel_public_key. Assembled by rotate_assemble_sshproxy_keys,
          # the SAME function rotate uses: it aborts when the shared key
          # would be missing from the result (MIGRATION.md §2). With the
          # shared key always in, the list is never empty — there is no
          # "skip" branch anymore.
          tunnel="$(refresh_collect_tunnel_keys "$vars_json" "$workers_json")"
          shared_tunnel_key="$(scripts/lib/crypto.sh decrypt "$FILE_CRYPTO_KEY" \
              < shared-configs/ssh-tunnel-server/files/authorized_keys.crypted 2>/dev/null \
              | sed '/^[[:space:]]*$/d' | head -1 || true)"
          if [[ -z "$shared_tunnel_key" ]]; then
            echo "::error::could not decrypt the shared tunnel key — refusing to overwrite the sshproxy list (a list without it locks every provider out)"
            exit 1
          fi
          sshproxy="$(rotate_assemble_sshproxy_keys "$shared_tunnel_key" "$tunnel")" || {
            echo "::error::sshproxy list assembly failed — refusing to touch the Gateway (MIGRATION add-before-remove guard)"
            exit 1
          }
          tunnel_count="$(printf '%s\n' "$sshproxy" | wc -l | tr -d ' ')"
          echo "tunnel_count=${tunnel_count}" >> "$GITHUB_OUTPUT"
          echo "tunnel_cmd=$(refresh_build_install_cmd /home/sshproxy/.ssh/authorized_keys "$sshproxy" --sudo)" >> "$GITHUB_OUTPUT"
          echo "assembled ${tunnel_count} sshproxy key(s): shared ∪ NODE_*/POOL_WORKERS tunnel keys"

      - name: Install login authorized_keys on the Gateway
        uses: ./.github/actions/pool-ssh
        with:
          node: gateway
          timeout: "30"
          command: |
            set -euo pipefail
            printf '%s' '${{ steps.assemble.outputs.login_cmd }}' | base64 -d | bash

      - name: Install tunnel authorized_keys on the Gateway (sshproxy)
        uses: ./.github/actions/pool-ssh
        with:
          node: gateway
          timeout: "30"
          command: |
            set -euo pipefail
            printf '%s' '${{ steps.assemble.outputs.tunnel_cmd }}' | base64 -d | bash