# ci.yml — 讓 preflight 與 scripts/tests/ 終於會自動跑。
#
# 為什麼有這個檔案：2026-09-26 之前，`ops-scripts/preflight`（repo 的靜態閘門）
# 與 `scripts/tests/` 底下 40 支測試（2026-09-26 當時的數量，現在 41 支）**從來不會自動跑**——五個既有 workflow 的
# trigger 全是 `workflow_dispatch`，沒有任何一個排程（兩點可用
# `grep -rn workflow_dispatch .github/workflows/` 與讀每支的 `on:` 自行核對）。
# 它們是「人要記得去跑」的東西。
#
# **一條存在而且正確、但從來不會自動跑的檢查，從 repo 的綠色歷史看起來，跟一條
# 通過的檢查完全一樣。** 沒有任何 run 失敗，所以「閘門壞掉」與「閘門從沒啟動過」
# 在證據上長得一模一樣。這是本檔存在的唯一理由。
#
# ------------------------------------------------------------------
# 這個 job 涵蓋不到什麼（寫在檔頭，因為它們不會在失敗時提醒任何人）
# ------------------------------------------------------------------
#
# 1. **bash 版本。** 開發者實際跑測試的是 macOS 系統 bash **3.2.57**；
#    `ubuntu-latest` 是 **5.x**。所以任何只在 3.2 出現的缺陷在這裡**永遠是綠的**
#    ——最有名的是 `$f（`（變數名被讀成 `f` 加那個多位元組字元的第一個位元組），
#    那個 pool 一天之內就抓到了四處。**CI 綠、本機紅，而人信的是 CI 那個綠。**
#    這也是為什麼那個缺陷的檢查（`scripts/tests/helpers/naked-var-multibyte.py`）
#    是**靜態掃描**而不是執行測試：**跟環境版本有關的缺陷，要用不執行程式的
#    方式檢查**，因為沒有任何執行環境能同時是 3.2 與 5.x。
# 2. **架構。** 本機與 qa 的沙盒是 arm64，runner 是 amd64，沒有對照組。
#    arm64 專屬的問題在這裡看不見，反之亦然。
# 3. **真機驗收。** 這個 job 不碰叢集。`docs/TESTPLAN.md` §3 那些人工驗收項目
#    （真 Gateway、真 provider、真的 create/delete/rotate）**一項都不在涵蓋內**。
#    綠燈的意義是「靜態與模擬層沒有退步」，不是「池子是對的」。
# 4. **排程。** 本檔只掛 push，不是排程，所以「連續 N 次綠才敢推」這類政策
#    不存在。未被追蹤的檔案也不會被掃到（preflight 與這支測試都只跑
#    `git ls-files` 的結果）——`git add` 之前，新檔案對兩者都是隱形的。
#
# ------------------------------------------------------------------
# 不變式：這個 job 不該產生任何對外連線（除了安裝套件那一步）
# ------------------------------------------------------------------
#
# `scripts/tests/` 底下有 5 支測試的 fixture 資料含 `sshproxy@172.104.114.31`
# （generation 8 的舊 IP，現在大概屬於別人），另有測試引用 `fzf`／`envsubst`／
# `gh`／`docker`／`ss`。**那些都是資料與被 shim 掉的工具，沒有任何測試真的連線。**
# 驗證方式（2026-09-26，實測不是推論）：把整個套件在一個 `--network none` 的
# ubuntu 24.04 容器裡跑，40 支裡除了下面那兩支紅的之外全綠——網路被拿掉之後
# 結果不變，就是沒有測試需要對外連線的意思。
#
# 所以：**這個 job 除了 `apt-get install` 那一步之外，不允許任何 step 對外連線。**
# 要新增會連線的步驟（真機驗收、打真 Gateway）時，那不是本檔，該是另一個
# workflow——否則這條不變式就沒有機制在守著，只是寫在註解裡。
#
# ------------------------------------------------------------------
# 現況：全綠（2026-09-26 實測，41/41 + preflight exit 0）
# ------------------------------------------------------------------
#
# 交到手上時這兩支是紅的，記錄在這裡是因為**它們各自曾經是什麼、為什麼不是缺陷**，
# 而那兩個理由正是「不要為紅的東西加豁免」的依據。
#
#   * `test-mlp-fwd.sh` 17b —— 曾紅。成因是**斷言的 bug**：17a/17b 各渲染一次，
#     而表格最後一欄嵌的是 `now_ms - start_ms`（即時量測值 FWD_PROBE_RTT），兩次
#     渲染可能在「數字」上不同而欄位起點完全沒動，舊斷言把「量測值變了」講成
#     「上色破壞了對齊」——方向剛好相反。已修（改成比**欄位幾何**：標題列逐位元組
#     ＋每列的欄位起點偏移）。修好後在無網路容器裡連跑 6 次全綠。
#   * `test-rollback-coverage.sh` —— 曾紅在注入 4h，而 4h 紅的是**守衛自己的模型**：
#     它的 `probe no-remedy` 只移除第一個 `push-state`+`failure()` block，不移除
#     第二個補救，所以 4h 的「基底」裡其實還有 authkeys 補救 → 只補快取後全綠 →
#     誤報。test 已修好模型（讓 authorized_keys 的孤兒被算成殘留類別）。實測
#     `passed 11 / failed 0 / injection-pass 9 / injection-fail 0`，連跑三次穩定。
#
# 為什麼當時**不**加豁免（現在仍然成立）：這兩支都是「斷言或模型還沒跟上」而不是
# 「測試壞掉」，而豁免會讓一個其實全綠的東西看起來是紅的——那正好是這個 gate 要消除
# 的形狀。**它自己就擺著不要用 continue-on-error 來處理紅的範本。**
#
# ⚠️ 這一段是「現況」，會過期。**這個檔頭最容易被下一次改動變成謊話**（它已經被
# 改過一次：寫的時候 gate 是紅的，現在是綠的）。有人修了測試之後，記得順手把上面
# 那兩段移到別處或刪掉——留著一個已經不紅的「曾經紅」清單，會讓下一個人以為這裡
# 還有未修的東西。
#
# 要暫時放行紅的測試的話用
# `continue-on-error: true`（見下），**不要用 `paths` 或 `if: false` 排除**。
name: CI
#
# 只掛 push 到 master：這是裁示過的。`workflow_dispatch` 順手留著，因為 otherwise
# 你只能在「下一次 push」時才驗證這個 gate 是否能跑——而 commit 之前沒有人能確定
# 它綠。要拿掉就刪這三行。
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    # 15 分鐘是「卡住」的上限，不是預期耗時。**出處與那個單支 timeout 一樣會
    # 過期**：2026-09-26 量到全套總時間 169 秒與約 320 秒（同一份程式碼、同一個
    # 無網路容器，兩輪），qa 在有其他負載的機器上量到 249 秒。15 分鐘是最高觀察值
    # 的 2.8 倍。**守衛改動後要重量**——它是全套最慢的一支，佔 qa 那 249 秒的 24%。
    # 為什麼要有這個上限：沒有的話，一支死鎖的測試會讓整個 job 掛到 GitHub 的
    # 6 小時上限，那期間這個 gate 什麼訊息都不給。
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 三個套件，**不是選配**。少了任何一個，下面就有一批測試紅，而紅的原因與它們
      # 本身無關——那種紅最容易被誤判成「測試壞了」。逐個拿掉量過（2026-09-26，
      # ubuntu 24.04 / bash 5.2 容器，`--network none`，其餘條件不變）：
      #
      #   python3-yaml —— 拿掉 → **preflight 自己 exit 1**（它的 YAML 檢查全紅），
      #     加上 10 支測試紅：test-capability-flags、test-create-worker-build、
      #     test-create-worker-source、test-rollback-coverage、
      #     test-rotate-authkeys、test-rotate-resilience、test-rotate-stdout-contract、
      #     test-ssh-admin-install、test-worker-tunnel-key、test-workers-d-path
      #     （30/40 通過；那時是 40 支，現在 41 支）。這一項最嚴重，因為 preflight 是這個 gate 的一部分。
      #   fzf —— 拿掉 → test-script-self-location 紅，訊息是
      #     `mlp: missing required tool(s): fzf`（38/40 通過，那時 40 支）。不是「選單壞掉」，
      #     是 mlp 在自我定位測試裡直接拒絕啟動。
      #   gettext-base —— 拿掉 → test-rotate-authkeys 與
      #     test-rotate-stdout-contract 紅，訊息是 `envsubst is required but not
      #     found on PATH`（37/40 通過，那時 40 支）。
      #
      # 三個都拿掉會是三個聯集的紅（實測至少 11 支紅 / 29 通過）。qa 2026-09-26 的
      # 數字是 33/41；總數與量法不同（我的容器是 40 支），但方向一致：**這三行是
      # 40/41 綠的前提，不是「保險起見加的」。** 誰把它刪掉，誰就是下一個看到十支
      # 測試莫明其妙紅的人。
      #
      # gettext-base 與 fzf 在 runner 映像裡到底在不在，qa 查了三份 apt 清單都沒有，
      # 但也沒排除被別的套件當相依拉進來。**照裝。** 上面那三行量測就是「賭輸」的
      # 結果長什麼樣。
      - name: Install the three packages the runner image lacks
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-yaml gettext-base fzf

      # preflight 與測試套件是**兩個 step**，不用 `&&` 串。
      # 串起來的好處只有一個（省一個 step），代價是前面紅了後面整段不跑，於是你
      # 只看得到第一個紅。哪裡在退步是同一個 push 要回答的問題，不該分兩次 push
      # 才看得到。
      - name: preflight
        run: bash ops-scripts/preflight

      - name: test suite
        run: |
          set -uo pipefail
          echo "bash: $BASH_VERSION"
          # 全部跑完再回報，不要碰到第一個紅就停：一次 push 應該一次告訴你所有
          # 退步的地方。逐支跑而不是 `for` + `&&` 串，也是同一個理由。
          #
          # 單支的 300 秒不是「隨便抓的數字」，但**它也不是「最高觀察值 × 2.5」**
          # ——那個說法是假的，而它曾經被寫在這裡（2026-09-26 修正）。
          #
          # 實際量到的是什麼（2026-09-26）。單支最慢的那支是 test-rollback-coverage：
          #   * 46 秒   —— ubuntu 24.04 / bash 5.2 / `--network none` 容器，跑完的
          #   * 169 秒  —— 同一個容器全套總時間
          #   * 126 秒  —— **同一個容器、同一份程式碼的第二輪，跑完的**
          #   * 59 秒（閒置）／84 秒（有負載）—— qa 的機器
          #   * 「120 秒以上觸發 TIMEOUT」—— **這不是觀察值，是量測上限**。那是 qa
          #     上一輪 harness 自己的 `timeout 120`，意思是「我不知道它還要多久，
          #     就在那裡把它砍了」。把它寫成「最高觀察值」會把一個**我停止量測的
          #     地方**說成「它最大會到這麼多」——那正是這份註解最容易犯的錯。
          #
          # 所以誠實的說法是：**真值未知，下界是 126 秒**（那是一次跑完的量測），
          # 上界沒有量到過。光是機器負載就帶來 46 → 126 秒（2.7 倍）的落差。
          #
          # 300 的依據是什麼：**「最高『跑完的』觀察值 × 2.4」**，而這個倍數是為了
          # 覆蓋負載落差，不是為了保證跑得完。**它不是「保證」**——若真值是 200 秒，
          # 300 只剩 1.5 倍餘裕；若真值是 280 秒，這裡就會誤殺一支只是慢的測試。
          # 真的發生時你會看到 TIMEOUT 那行，正確反應是**查它為什麼慢並重量**，
          # 不是把常數往上調到綠。
          #
          # 為什麼單支 timeout 要寬鬆：真正的 CI 風險不是「測試太慢」，而是**被
          # timeout 殺掉時你分不出它是慢還是死了**。所以這裡把 124（timeout 的
          # 結束碼）單獨報成 TIMEOUT 而不是混進 FAIL——混進去，下次有人看到滿屏紅
          # 會以為改壞了什麼，其實只是慢了。
          #
          # ---- 這兩個數字（單支 300 與 job 15 分鐘）是耦合的 ------------------
          #
          # 把 300 代進去算（用 qa 的全套 249s，其中最慢那支貢獻約 60s）：
          #   * 一支吃滿 300 → 全套約 490s
          #   * 兩支吃滿 300 → 約 730s（仍在 900s 之下）
          #   * **三支吃滿 300 → 約 970s，超過 timeout-minutes: 15（900s）**
          # 那時候 job 的結論**不是「測試紅了」，而是「被取消」**。而取消與失敗在
          # branch protection 裡是不同的東西——一個設成 required check must pass 的
          # 規則，看到 cancelled 的行為跟看到 failure 不同。所以：**如果你看到 CI 從
          # 「紅」變成「取消」，第一個要查的是這三支，不是測試本身。**
          #
          # 下一個要調這兩個數字的人：它們不是獨立的。調高單支上限之前先看這段
          # 算式，否則你會把「測試紅了」換成「job 被取消」，而後者更難查。
          PER_TEST_TIMEOUT=300
          # -k 是**必需**的，不是保險。GNU timeout 沒有 -k 時只送 SIGTERM 然後
          # **無限期等**：一支 `trap '' TERM` 的測試會讓這個 per-test timeout
          # 完全失效（它變成一個請求而不是上限），於是 job 一路掛到
          # timeout-minutes——也就是上面那個「被取消」的結局。-k 10 的意思是
          # SIGTERM 後 10 秒再送 SIGKILL。代價：單支最壞的情況從 300s 變成 310s，
          # 所以上面那個三支的算式也要跟著記（970s → 約 1000s，一樣超過 900s，
          # 結論不變）。
          fail=0
          total=0
          for t in scripts/tests/test-*.sh; do
            n="$(basename "$t" .sh)"
            total=$((total + 1))
            # 變數名不叫 log：ops-scripts/preflight 的 wf-fn-sources.py 會把一個
            # 變數賦值讀成「呼叫了 scripts/lib/log.sh 的那個函式」，然後報這個 step
            # 沒有 source 它。那是它的保守猜測（不是機制壞掉），所以正確的回應是
            # 不要撞那個名字，而不是加一張例外清單。
            #
            # 附帶一個自己踩到的坑，這也是上一版被擋下來的原因：原本的說明用反引號
            # 把那個函式名包起來，而反引號在 wf-fn-sources.py 的 CMD 樣式裡正是
            # 「命令位置」的五個標記之一——於是**用來解釋撞名的註解，自己變成了
            # 撞名的那一行**。寫檢查相關的說明時，那個檢查會連註解一起讀。
            # -k 10：沒有它的話這不是上限（見上面 PER_TEST_TIMEOUT 那段）。
            # 實測（/tmp/kill-test/fake-hang.sh，trap '' TERM + sleep 999）：
            # 沒有 -k 時 `timeout 5` 送了 TERM 之後無限期等，連呼叫端一起掛住；
            # `timeout -k 2 3` 回 rc=137。兩個別搞混：
            #   * 137 是「被 KILL 的」，不是「超時」——所以下面只把 124 報成
            #     TIMEOUT，137 走 FAIL 那條。不把 137 併進 TIMEOUT 是故意的：
            #     137 也可能是 runner OOM 殺的，那跟慢完全是兩件事。
            #   * -k 殺的是 timeout 的直屬子行程（bash）。孫行程（例如還在 sleep
            #     的那個）會變成孤兒留著——它不擋住這個 step 結束，只佔一個
            #     行程槽。Runner 跑完就丟，所以這裡接受。
            outlog="$RUNNER_TEMP/$n.log"
            start=$SECONDS
            # GitHub 跑 run: 預設是 bash -e（log 見 shell: /usr/bin/bash -e {0}）。
            # 測試失敗是預期內的資料、不是 shell 錯誤：這一行的非 0 不能觸發 -e
            # 整步退出，否則下面的分類、tail、彙總永遠走不到。用 || 接住 rc，
            # 其餘行保留 -e（意外的 shell 錯誤仍會大聲退出，而不是靜默續跑）。
            rc=0
            timeout -k 10 "$PER_TEST_TIMEOUT" bash "$t" > "$outlog" 2>&1 || rc=$?
            took=$(( SECONDS - start ))
            if [[ "$rc" -eq 0 ]]; then
              printf '  ok    %-40s %ss\n' "$n" "$took"
            elif [[ "$rc" -eq 124 ]]; then
              # 124 = timeout 殺的。它跟「測試自己紅」是兩種狀態，混在一起報的話
              # 兩邊都看不見——所以分開。
              printf '  TIMEOUT %-37s >%ss（上限 %s）\n' "$n" "$took" "$PER_TEST_TIMEOUT"
              fail=$((fail + 1))
              printf -- '---- %s (tail, 可能不完整) ----\n' "$n"
              tail -n 30 "$outlog" | sed 's/^/    /'
              printf -- '---- end %s ----\n' "$n"
            else
              printf '  FAIL  %-40s %ss\n' "$n" "$took"
              fail=$((fail + 1))
              # 立刻把失敗那支的尾巴印出來，不然要自己去 Actions 介面翻。
              printf -- '---- %s (tail) ----\n' "$n"
              tail -n 30 "$outlog" | sed 's/^/    /'
              printf -- '---- end %s ----\n' "$n"
            fi
          done
          echo
          echo "passed $((total - fail)) / failed $fail / total $total"
          exit "$fail"

      # ------------------------------------------------------------------
      # 沒有在用的 continue-on-error 範本（2026-09-26）
      # ------------------------------------------------------------------
      #
      # 寫在這裡是因為它隨時會被需要，而**沒有到期條件的豁免會變成永久的靜默破洞**
      # ——那正是這個 repo 一天之內修過七處的形狀：兩種狀態共用一個值，下游看不出
      # 差別。所以要加的時候，豁免的那一步必須同時寫下：
      #
      #   * 為什麼它現在不阻擋（症狀是什麼、影響是什麼）
      #   * **什麼條件成立時把 continue-on-error 拿掉**（到期條件）
      #   * 誰負責拿（人或 issue 編號）
      #
      # 形狀：
      #
      #   - name: <支>
      #     continue-on-error: true     # 暫時不阻擋：<症狀>。<到期：<條件>時拿掉>。<誰>
      #     run: bash scripts/tests/<支>.sh
      #
      # 為什麼是 `continue-on-error` 而不是從迴圈裡排除它：**排除會讓它安靜消失**，
      # 從此沒有任何人知道它曾經紅過。`continue-on-error` 留下一個可見但不阻擋的
      # 紅——那個紅就是到期條件的提醒器。
      #
      # 2026-09-26 的記錄：原本有兩支帶豁免（test-mlp-fwd 17b 與
      # test-mlp-noninteractive）。前者成因已定、是斷言的 bug，test 修完直接當
      # 阻擋性；後者的 PTY 問題已在工作樹修掉（master 留到子行程結束才關、另開
      # 執行緒把 master 讀空），在 amd64 / bash 5.2 的容器裡綠，所以**都沒有加**
