name: Create linode

on:
  workflow_dispatch:
    inputs:
      label:
        type: string
        description: instance label
        required: true
        default: fws
      region:
        type: string
        description: instance region
        required: true
        default: ap-northeast
      type:
        type: string
        description: instance type
        required: true
        default: g6-nanode-1
      image:
        type: string
        description: instance image
        required: true
        default: linode/ubuntu24.04
  workflow_call:
    inputs:
      label:
        type: string
        description: instance label
        required: true
        default: fws
      region:
        type: string
        description: instance region
        required: true
        default: ap-northeast
      type:
        type: string
        description: instance type
        required: true
        default: g6-nanode-1
      image:
        type: string
        description: instance image
        required: true
        default: linode/ubuntu24.04
      
jobs:
  create_linode:
    name: create linode
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::084437056934:role/fwsVolatileDataOperator
        aws-region: ap-northeast-1

    - name: Install the Linode CLI
      uses: linode/action-linode-cli@v1
      with:
        token: ${{ secrets.LINODE_TOKEN }}

    - name: Install nessary tools
      run: |
        sudo apt-get update
        sudo apt-get install -y sshpass

    - name: Build file bundle for Linode
      env:
        FILE_CRYPTO_KEY: ${{ secrets.FILE_CRYPTO_KEY }}
      run: |
        # create file base dir
        mkdir to_sync_files

        # copy normal files to to_sync_files
        cp -r static_normal_files/* to_sync_files/

        # download volatile files from s3
        aws s3 cp s3://fws-volatile-data to_sync_files --recursive

        # decrypt secret files and copy to to_sync_files
        cfs=($(find static_secret_files -type f -name '*.crypted'))
        for cf in "${cfs[@]}"; do
          dst_file=${cf/static_secret_files/to_sync_files}
          dst_file=${dst_file%.crypted}

          mkdir -p $(dirname $dst_file)

          echo "Decrypting $cf..."
          cat $cf | ./scripts/decryptStdin.sh $FILE_CRYPTO_KEY > $dst_file
        done

    - name: Generate tmp password
      run: |
        ROOT_PASS=$(openssl rand -base64 15 | tr -d '\n' | head -c 20)
        FATESAIKOU_TMP_PASS=$(openssl rand -base64 15 | tr -d '\n' | head -c 20)
        SSHPROXY_TMP_PASS=$(openssl rand -base64 15 | tr -d '\n' | head -c 20)

        # Mask TMP_PASS
        echo "::add-mask::$ROOT_PASS"
        echo "::add-mask::$FATESAIKOU_TMP_PASS"
        echo "::add-mask::$SSHPROXY_TMP_PASS"

        # Export to github env
        echo "ROOT_PASS=$ROOT_PASS" >> $GITHUB_ENV
        echo "FATESAIKOU_TMP_PASS=$FATESAIKOU_TMP_PASS" >> $GITHUB_ENV
        echo "SSHPROXY_TMP_PASS=$SSHPROXY_TMP_PASS" >> $GITHUB_ENV

    - name: Create a Linode instance
      env:
        ROOT_PASS: ${{ env.ROOT_PASS }}
        FATESAIKOU_TMP_PASS: ${{ env.FATESAIKOU_TMP_PASS }}
        SSHPROXY_TMP_PASS: ${{ env.SSHPROXY_TMP_PASS }}
      run: |
        # Create the Linode instance
        linode_cli_ret=$(
            linode-cli linodes create \
                --no-defaults \
                --label ${{ github.event.inputs.label }} \
                --region ${{ github.event.inputs.region }} \
                --type ${{ github.event.inputs.type }} \
                --image ${{ github.event.inputs.image }} \
                --root_pass $ROOT_PASS \
                --json \
                --metadata.user_data "$(cat ./cloud_config.yaml | envsubst | base64 | tr -d '\n')"
        )

        # echo the output to the console
        echo "<<<<<Linode instance created>>>>>"
        echo $linode_cli_ret | jq

        # Export Linode IP to github env
        LINODE_IP=$(echo $linode_cli_ret | jq -r '.[0] | .ipv4 | .[0]')
        echo "LINODE_IP=$LINODE_IP" >> $GITHUB_ENV

        # Wait ssh service is up
        EXEC_CMD="sshpass -p $ROOT_PASS ssh -o ConnectTimeout=1 -o StrictHostKeyChecking=no root@$LINODE_IP"
        while [ "$($EXEC_CMD "echo 'success'" 2>/dev/null)" != "success" ]; do
          echo "[$(date)] Waiting SSH..."
          sleep 1
        done

    - name: Install nessary dependencies
      env:
        ROOT_PASS: ${{ env.ROOT_PASS }}
        LINODE_IP: ${{ env.LINODE_IP }}
      run: |
        EXEC_CMD="sshpass -p $ROOT_PASS ssh -o StrictHostKeyChecking=no root@$LINODE_IP"

        $EXEC_CMD "
          # Install with apt
          while sudo fuser /var/lib/apt/lists/lock >/dev/null 2>&1; do
            echo "Waiting for apt lock to be released..."
            sleep 1
          done

          apt-get update && apt-get install -y git vim tmux curl unzip

          # Install awscli
          curl \"https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip\" -o \"/tmp/awscliv2.zip\"
          unzip /tmp/awscliv2.zip
          ./aws/install
        "

    - name: Copy files to the Linode instance
      env:
        ROOT_PASS: ${{ env.ROOT_PASS }}
        LINODE_IP: ${{ env.LINODE_IP }}
      run: |
        EXEC_CMD="sshpass -p $ROOT_PASS ssh -o ConnectTimeout=1 -o StrictHostKeyChecking=no root@$LINODE_IP"
        SCP_CMD="sshpass -p $ROOT_PASS scp -o StrictHostKeyChecking=no"

        # Wait ssh service is up
        while [ "$($EXEC_CMD "echo 'success'" 2>/dev/null)" != "success" ]; do
          echo "[$(date)] Waiting SSH..."
          sleep 1
        done

        $SCP_CMD -r to_sync_files/* root@$LINODE_IP:/
        rm -rf to_sync_files

        # Wait ssh service is up
        while [ "$($EXEC_CMD "echo 'success'" 2>/dev/null)" != "success" ]; do
          echo "[$(date)] Waiting SSH..."
          sleep 1
        done
        
        # Chown for fatesaikou and sshproxy
        $EXEC_CMD "chown -R fatesaikou:fatesaikou /home/fatesaikou"
        $EXEC_CMD "chown -R sshproxy:sshproxy /home/sshproxy"

    - name: Install language supports for fatesaikou
      env:
        FATESAIKOU_TMP_PASS: ${{ env.FATESAIKOU_TMP_PASS }}
        LINODE_IP: ${{ env.LINODE_IP }}
      run: |
        EXEC_CMD="sshpass -p $FATESAIKOU_TMP_PASS ssh -o StrictHostKeyChecking=no fatesaikou@$LINODE_IP"

        $EXEC_CMD "
          # Install asdf
          git clone https://github.com/asdf-vm/asdf.git ~/.asdf --branch v0.14.0
          echo '. $HOME/.asdf/asdf.sh' >> ~/.bashrc

          # Install nodejs
          asdf plugin-add nodejs
          asdf install nodejs 22.2.0
          asdf global nodejs 22.2.0

          # Install python
          asdf plugin-add python
          asdf install python 3.12.0
          asdf global python 3.12.0

          # Install golang
          asdf plugin-add golang
          asdf install golang 1.23.0
          asdf global golang 1.23.0
        "

    - name: Initialize softwares for fatesaikou
      env:
        FATESAIKOU_TMP_PASS: ${{ env.FATESAIKOU_TMP_PASS }}
        LINODE_IP: ${{ env.LINODE_IP }}
      run: |
        EXEC_CMD="sshpass -p $FATESAIKOU_TMP_PASS ssh -o StrictHostKeyChecking=no fatesaikou@$LINODE_IP"

        while [ "$($EXEC_CMD "echo 'success'" 2>/dev/null)" != "success" ]; do
          echo "[$(date)] Waiting SSH..."
          sleep 1
        done

        $EXEC_CMD "
          # Initialize vim
          git clone https://github.com/VundleVim/Vundle.vim.git ~/.vim/bundle/Vundle.vim;
          vim -E -s -u ~/.vimrc +PluginInstall +qall || exit 0;

          # Initialize tmux
          git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm;
          ~/.tmux/plugins/tpm/bin/install_plugins;
        "

    - name: Switch DNS and update hosts
      id: switch_dns
      env:
        ROOT_PASS: ${{ env.ROOT_PASS }}
        LINODE_IP: ${{ env.LINODE_IP }}
        CSIE_IO_TOKEN: ${{ secrets.CSIE_IO_TOKEN }}
        CSIE_IO_HOST: ${{ vars.CSIE_IO_HOST }}
      run: |
        EXEC_CMD="sshpass -p $ROOT_PASS ssh -o ConnectTimeout=1 -o StrictHostKeyChecking=no root@$LINODE_IP"

        # Get current ip from csie.io and echo to github env
        CURRENT_IP=$(dig +short $CSIE_IO_HOST.csie.io)
        echo "CURRENT_IP=$CURRENT_IP" >> $GITHUB_ENV

        # Switch DNS
        curl -s "https://csie.io/update?hn=$CSIE_IO_HOST&token=$CSIE_IO_TOKEN&ip=$LINODE_IP"
        echo '' # just for output a newline

        # Wait ssh service is up
        while [ "$($EXEC_CMD "echo 'success'" 2>/dev/null)" != "success" ]; do
          echo "[$(date)] Waiting SSH..."
          sleep 1
        done

        # Watch sshproxy with 5 min timeout
        TIMEOUT_SEC=300
        PROXYED_ENTRY_PORT='2223' # cms

        current_time=$(date +%s)
        while true; do
            echo -n "[$(date)][$LINODE_IP][$PROXYED_ENTRY_PORT] "
            $EXEC_CMD "nc -z -v localhost $PROXYED_ENTRY_PORT; exit $?"

            # if connected, then break
            if [ $? -eq 0 ]; then
                break
            fi

            # if timeout, exit with 1
            if [ $(($(date +%s) - $current_time)) -gt $TIMEOUT_SEC ]; then
                echo "[$(date)] Timeout"
                exit 1
            fi

            sleep 1
        done

    # if switch fail and env.CURRENT_IP is not empty, then set back
    - name: Set back DNS if switch fail
      if: ${{ failure() && env.CURRENT_IP != '' }}
      env:
        CSIE_IO_TOKEN: ${{ secrets.CSIE_IO_TOKEN }}
        CSIE_IO_HOST: ${{ vars.CSIE_IO_HOST }}
        CURRENT_IP: ${{ env.CURRENT_IP }}
      run: curl -s "https://csie.io/update?hn=$CSIE_IO_HOST&token=$CSIE_IO_TOKEN&ip=$CURRENT_IP"

    - name: Lock password for fatesaikou and sshproxy and disable remote login of root
      env:
        ROOT_PASS: ${{ env.ROOT_PASS }}
        LINODE_IP: ${{ env.LINODE_IP }}
      run: |
        EXEC_CMD="sshpass -p $ROOT_PASS ssh -o StrictHostKeyChecking=no root@$LINODE_IP"

        while [ "$($EXEC_CMD "echo 'success'" 2>/dev/null)" != "success" ]; do
          echo "[$(date)] Waiting SSH..."
          sleep 1
        done

        $EXEC_CMD "
          passwd -l fatesaikou
          passwd -l sshproxy
          sed -i '/PermitRootLogin/d' /etc/ssh/sshd_config
          echo \"PermitRootLogin no\" >> /etc/ssh/sshd_config
          systemctl reload ssh.service
        "

