name: Delete Worker

# spec: docs/POOL_RUNTIME_SPEC.md §10.4
#
# Every remote command goes through .github/actions/pool-ssh — this file
# never constructs its own `ssh -J ...` chain. Input validation and claim
# matching live in scripts/delete-worker.sh (docs/LAYOUT.md §3).

on:
  workflow_dispatch:
    inputs:
      port:
        description: Worker's Gateway port (from Create Worker's output). Either this or name.
        required: false
      name:
        description: Worker name (from Create Worker's output). Either this or port.
        required: false

permissions:
  contents: read

env:
  GH_TOKEN: ${{ secrets.GH_POOL_TOKEN }}
  GH_REPO: ${{ github.repository }}
  # Every NODE_* hop's key_secret points at this one Actions identity now
  # (see docs/ARCHITECTURE.md §3) — pool-ssh's agent only ever needs it.
  SSH_KEY_ACTIONS: ${{ secrets.SSH_KEY_ACTIONS }}

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 'port'/'name' feed into remote command text below — validated here
      # via `env:` (never inlined directly into this script's own body,
      # since that's exactly what this step exists to make safe for every
      # step after it).
      - name: Validate inputs
        shell: bash
        env:
          PORT_IN: ${{ inputs.port }}
          NAME_IN: ${{ inputs.name }}
        run: |
          set -euo pipefail
          source scripts/delete-worker.sh
          delete_worker_validate_inputs "$PORT_IN" "$NAME_IN" || { echo "::error::invalid input — see log above"; exit 1; }

      # pool-port-alloc is installed at ~/.mylinuxpool/bin/ on the Gateway
      # (shared-configs/pool-runtime's install.sh, called from
      # provision-gateway.sh) — call that directly. Piping the script's
      # own text into `bash -c` was the earlier approach, but $BASH_SOURCE
      # isn't a real path under `-c`, which broke pool-port-alloc's own
      # SCRIPT_DIR-relative lookup of pool-resolve (2026-09-14 incident) —
      # same fix as create-worker.yml.
      - name: List worker port claims on the Gateway
        id: list
        uses: ./.github/actions/pool-ssh
        with:
          node: gateway
          command: ~/.mylinuxpool/bin/pool-port-alloc --list

      - name: Find the matching claim
        id: find
        shell: bash
        env:
          # Passed as a real env var (not inlined via ${{ }} in the script
          # body) so its content is never re-parsed as shell syntax —
          # matters here since these placeholders can carry a name
          # someone passed to create-worker.yml.
          CLAIMS_JSON: ${{ steps.list.outputs.stdout }}
          PORT_IN: ${{ inputs.port }}
          NAME_IN: ${{ inputs.name }}
        run: |
          set -euo pipefail
          source scripts/delete-worker.sh
          delete_worker_find_claim "$CLAIMS_JSON" "$PORT_IN" "$NAME_IN" >> "$GITHUB_OUTPUT" \
            || { echo "::error::no worker port claim found — see log above"; exit 1; }

      # Best-effort: fh-l is normally powered OFF, so deleting one of its
      # workers routinely cannot reach the provider, and that must not block
      # freeing the port below.
      #
      # The failure is NOT visible on its own, despite what this comment
      # used to claim: the REST API reports conclusion "success" for a
      # continue-on-error step, so `mlp` (and anything else reading the API)
      # sees a clean green run. Only the raw log carries outcome=failure.
      # Hence the explicit step below, which exists to be seen.
      - name: Stop and remove the container on the provider
        id: rm_container
        if: steps.find.outputs.container != ''
        continue-on-error: true
        uses: ./.github/actions/pool-ssh
        with:
          node: ${{ steps.find.outputs.provider }}
          command: docker rm -f ${{ steps.find.outputs.container }}

      # Runs ONLY when the removal failed, so its presence in the step list
      # is the signal — a skipped step renders as a quiet dash in `mlp`.
      # The container is not leaked: the provider's own pool-sync sweeps
      # containers the ledger no longer lists, so this resolves itself the
      # next time the machine is up.
      - name: "⚠ provider unreachable — container NOT removed (swept on its next boot)"
        if: steps.rm_container.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::could not remove ${{ steps.find.outputs.container }} on ${{ steps.find.outputs.provider }} — the provider is unreachable. The port and ledger entry are released; the provider's pool-sync will remove the container when it next runs."
          {
            echo "### Container not removed"
            echo ""
            echo "\`${{ steps.find.outputs.container }}\` is still on **${{ steps.find.outputs.provider }}** — the provider was unreachable."
            echo "Its port and ledger entry have been released. The provider's \`pool-sync\` removes containers that POOL_WORKERS no longer lists, so this clears itself on the next boot."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Release the port on the Gateway
        uses: ./.github/actions/pool-ssh
        with:
          node: gateway
          command: ~/.mylinuxpool/bin/pool-port-alloc --release ${{ steps.find.outputs.port }}

      # POOL_WORKERS is the master ledger; the Gateway placeholder released
      # in the previous step is only its cache (docs/STATE_CONTRACT.md §1).
      - name: Remove the worker from POOL_WORKERS
        shell: bash
        run: |
          set -euo pipefail
          source scripts/lib/ledger.sh
          cur="$(gh api "repos/${GH_REPO}/actions/variables/POOL_WORKERS" --jq .value 2>/dev/null || true)"
          new="$(ledger_remove "$cur" "${{ steps.find.outputs.port }}")"
          printf '%s' "$new" | gh variable set POOL_WORKERS --repo "$GH_REPO"
          echo "POOL_WORKERS now holds $(printf '%s' "$new" | jq 'length') worker(s)"

      # The worker's tunnel public key was authorized on the Gateway when
      # it was created; deleting the ledger entry alone leaves the key
      # authorized forever (KEY-DESIGN §3.2: delete is revocation). Push a
      # refresh to pull the key OFF the Gateway. A failed dispatch or a
      # failed run FAILS the workflow — a leftover authorized key is a
      # security issue, not something to swallow. Logic lives in
      # create_worker_dispatch_refresh_and_wait (thin caller, LAYOUT §3).
      - name: Refresh the Gateway authorized keys
        shell: bash
        run: |
          set -euo pipefail
          source scripts/create-worker.sh
          # dispatches refresh-authorized-keys.yml and waits for it to complete
          create_worker_dispatch_refresh_and_wait 300 \
            || { echo "::error::could not refresh the Gateway authorized keys — see log above"; exit 1; }

      - name: Resolve Gateway for the push
        id: gw
        shell: bash
        run: |
          set -euo pipefail
          gw_json="$(shared-configs/pool-runtime/files/pool-resolve gateway --refresh)"
          {
            echo "ip=$(jq -r '.ip' <<<"$gw_json")"
            echo "ssh_port=$(jq -r '.port // 22' <<<"$gw_json")"
            echo "host_key=$(jq -r '.host_key // ""' <<<"$gw_json")"
          } >> "$GITHUB_OUTPUT"

      - name: Push the state cache
        uses: ./.github/actions/push-state
        with:
          gateway-ip: ${{ steps.gw.outputs.ip }}
          gateway-port: ${{ steps.gw.outputs.ssh_port }}
          host-key: ${{ steps.gw.outputs.host_key }}
          source: delete-worker#${{ github.run_id }}
          # These workflows reach machines through the pool-ssh action,
          # which loads keys per call — there is no agent for push-state to
          # borrow, unlike repair-gateway. Hand it the key instead of
          # depending on what the caller happens to have set up.
          ssh-key: ${{ secrets.SSH_KEY_ACTIONS }}

      - name: Summary
        shell: bash
        run: |
          echo "Deleted worker on ${{ steps.find.outputs.provider }} (container ${{ steps.find.outputs.container }}), released port ${{ steps.find.outputs.port }}."
