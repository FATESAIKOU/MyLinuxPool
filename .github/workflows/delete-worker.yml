name: Delete Worker

# spec: docs/POOL_RUNTIME_SPEC.md §10.4
#
# Every remote command goes through .github/actions/pool-ssh — this file
# never constructs its own `ssh -J ...` chain. Input validation and claim
# matching live in scripts/delete-worker.sh (docs/LAYOUT.md §3).

on:
  workflow_dispatch:
    inputs:
      port:
        description: Worker's Gateway port (from Create Worker's output). Either this or name.
        required: false
      name:
        description: Worker name (from Create Worker's output). Either this or port.
        required: false
      nonce:
        description: 'Optional correlation token from the dispatcher. mlp passes an unpredictable value here so it can recognize its own run in a frequently-dispatched workflow. UI and hand dispatches leave it empty.'
        required: false
        default: ''
        type: string

# Lets a dispatcher recognize its own run: mlp's wf_dispatch passes an
# unpredictable nonce as `nonce` and, when the run id gh prints is not
# available, finds its run by matching displayTitle for it. UI and hand
# dispatches pass nothing and keep the plain title (plus a trailing space).
# One mechanism for create/delete/rotate; the fourth workflow with the
# same shape is refresh-authorized-keys.yml (see ops-scripts/mlp wf_dispatch
# for why the refresh waiter still leads with the title channel).
run-name: Delete Worker ${{ inputs.nonce }}

permissions:
  contents: read

env:
  GH_TOKEN: ${{ secrets.GH_POOL_TOKEN }}
  GH_REPO: ${{ github.repository }}
  # Every NODE_* hop's key_secret points at this one Actions identity now
  # (see docs/ARCHITECTURE.md §3) — pool-ssh's agent only ever needs it.
  SSH_KEY_ACTIONS: ${{ secrets.SSH_KEY_ACTIONS }}

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 'port'/'name' feed into remote command text below — validated here
      # via `env:` (never inlined directly into this script's own body,
      # since that's exactly what this step exists to make safe for every
      # step after it).
      - name: Validate inputs
        shell: bash
        env:
          PORT_IN: ${{ inputs.port }}
          NAME_IN: ${{ inputs.name }}
        run: |
          set -euo pipefail
          source scripts/delete-worker.sh
          delete_worker_validate_inputs "$PORT_IN" "$NAME_IN" || { echo "::error::invalid input — see log above"; exit 1; }

      # pool-port-alloc is installed at ~/.mylinuxpool/bin/ on the Gateway
      # (shared-configs/pool-runtime's install.sh, called from
      # provision-gateway.sh) — call that directly. Piping the script's
      # own text into `bash -c` was the earlier approach, but $BASH_SOURCE
      # isn't a real path under `-c`, which broke pool-port-alloc's own
      # SCRIPT_DIR-relative lookup of pool-resolve (2026-09-14 incident) —
      # same fix as create-worker.yml.
      - name: List worker port claims on the Gateway
        id: list
        uses: ./.github/actions/pool-ssh
        with:
          node: gateway
          command: ~/.mylinuxpool/bin/pool-port-alloc --list

      - name: Find the matching claim
        id: find
        shell: bash
        env:
          # Passed as a real env var (not inlined via ${{ }} in the script
          # body) so its content is never re-parsed as shell syntax —
          # matters here since these placeholders can carry a name
          # someone passed to create-worker.yml.
          CLAIMS_JSON: ${{ steps.list.outputs.stdout }}
          PORT_IN: ${{ inputs.port }}
          NAME_IN: ${{ inputs.name }}
        run: |
          set -euo pipefail
          source scripts/delete-worker.sh
          delete_worker_find_claim "$CLAIMS_JSON" "$PORT_IN" "$NAME_IN" >> "$GITHUB_OUTPUT" \
            || { echo "::error::no worker port claim found — see log above"; exit 1; }

      # Best-effort: fh-l is normally powered OFF, so deleting one of its
      # workers routinely cannot reach the provider, and that must not block
      # freeing the port below.
      #
      # The failure is NOT visible on its own, despite what this comment
      # used to claim: the REST API reports conclusion "success" for a
      # continue-on-error step, so `mlp` (and anything else reading the API)
      # sees a clean green run. Only the raw log carries outcome=failure.
      # Hence the explicit step below, which exists to be seen.
      - name: Stop and remove the container on the provider
        id: rm_container
        if: steps.find.outputs.container != ''
        continue-on-error: true
        uses: ./.github/actions/pool-ssh
        with:
          node: ${{ steps.find.outputs.provider }}
          command: docker rm -f ${{ steps.find.outputs.container }}

      # Runs ONLY when the removal failed, so its presence in the step list
      # is the signal — a skipped step renders as a quiet dash in `mlp`.
      # The container is not leaked: the provider's own pool-sync sweeps
      # containers the ledger no longer lists, so this resolves itself the
      # next time the machine is up.
      - name: "⚠ provider unreachable — container NOT removed (swept on its next boot)"
        if: steps.rm_container.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::could not remove ${{ steps.find.outputs.container }} on ${{ steps.find.outputs.provider }} — the provider is unreachable. The port and ledger entry are released; the provider's pool-sync will remove the container when it next runs."
          {
            echo "### Container not removed"
            echo ""
            echo "\`${{ steps.find.outputs.container }}\` is still on **${{ steps.find.outputs.provider }}** — the provider was unreachable."
            echo "Its port and ledger entry have been released. The provider's \`pool-sync\` removes containers that POOL_WORKERS no longer lists, so this clears itself on the next boot."
          } >> "$GITHUB_STEP_SUMMARY"

      # S6. No `continue-on-error` and no `if: failure()` retry, on purpose:
      # a retry of ONLY this step would clear the placeholder while the
      # ledger/key/cache stay dirty — and then a rerun could no longer find
      # the worker (Find reads the placeholder), turning a rerun-healable
      # residue into manual ledger surgery. A full-tail retry would duplicate
      # Remove-from-POOL_WORKERS → Refresh → Resolve → Push (whose gateway
      # outputs do not exist yet at this point) and intrude on D3/D4/D5,
      # which are decided known limits. So S6 stays fail-loud, and the
      # failure step at the bottom tells the operator the exact rerun.
      # `id: release` exists only so that step can tell "died here" from
      # "died later"; it changes no behavior.
      - name: Release the port on the Gateway
        id: release
        uses: ./.github/actions/pool-ssh
        with:
          node: gateway
          command: ~/.mylinuxpool/bin/pool-port-alloc --release ${{ steps.find.outputs.port }}

      # POOL_WORKERS is the master ledger; the Gateway placeholder released
      # in the previous step is only its cache (docs/STATE_CONTRACT.md §1).
      - name: Remove the worker from POOL_WORKERS
        shell: bash
        run: |
          set -euo pipefail
          source scripts/lib/ledger.sh
          cur="$(gh api "repos/${GH_REPO}/actions/variables/POOL_WORKERS" --jq .value 2>/dev/null || true)"
          new="$(ledger_remove "$cur" "${{ steps.find.outputs.port }}")"
          printf '%s' "$new" | gh variable set POOL_WORKERS --repo "$GH_REPO"
          echo "POOL_WORKERS now holds $(printf '%s' "$new" | jq 'length') worker(s)"

      # The worker's tunnel public key was authorized on the Gateway when
      # it was created; deleting the ledger entry alone leaves the key
      # authorized forever (KEY-DESIGN §3.2: delete is revocation). Push a
      # refresh to pull the key OFF the Gateway. A failed dispatch or a
      # failed run FAILS the workflow — a leftover authorized key is a
      # security issue, not something to swallow. Logic lives in
      # create_worker_dispatch_refresh_and_wait (thin caller, LAYOUT §3).
      - name: Refresh the Gateway authorized keys
        shell: bash
        run: |
          set -euo pipefail
          source scripts/create-worker.sh
          # dispatches refresh-authorized-keys.yml and waits for it to complete
          create_worker_dispatch_refresh_and_wait 300 \
            || { echo "::error::could not refresh the Gateway authorized keys — see log above"; exit 1; }

      - name: Resolve Gateway for the push
        id: gw
        shell: bash
        run: |
          set -euo pipefail
          gw_json="$(shared-configs/pool-runtime/files/pool-resolve gateway --refresh)"
          {
            echo "ip=$(jq -r '.ip' <<<"$gw_json")"
            echo "ssh_port=$(jq -r '.port // 22' <<<"$gw_json")"
            echo "host_key=$(jq -r '.host_key // ""' <<<"$gw_json")"
          } >> "$GITHUB_OUTPUT"

      - name: Push the state cache
        uses: ./.github/actions/push-state
        with:
          gateway-ip: ${{ steps.gw.outputs.ip }}
          gateway-port: ${{ steps.gw.outputs.ssh_port }}
          host-key: ${{ steps.gw.outputs.host_key }}
          source: delete-worker#${{ github.run_id }}
          # These workflows reach machines through the pool-ssh action,
          # which loads keys per call — there is no agent for push-state to
          # borrow, unlike repair-gateway. Hand it the key instead of
          # depending on what the caller happens to have set up.
          ssh-key: ${{ secrets.SSH_KEY_ACTIONS }}

      - name: Summary
        shell: bash
        run: |
          echo "Deleted worker on ${{ steps.find.outputs.provider }} (container ${{ steps.find.outputs.container }}), released port ${{ steps.find.outputs.port }}."

      # --- S6 failure containment: explain, don't auto-retry -----------------
      #
      # What S6 failure leaves behind (D2): the container is already gone,
      # but the placeholder (workers.d/<port>.json), the POOL_WORKERS entry,
      # the authorized key, and the state-cache declaration all remain, and
      # every step after S6 is skipped. `pool-port-alloc --claim` avoids
      # placeholders (spec §10.1), and no daily flow releases one
      # (--release is called only here and in create-worker's failure path;
      # pool-status is read-only; pool-sync sweeps containers, not
      # placeholders; rotate restores claims FROM the still-dirty ledger),
      # so the port stays unusable until someone reruns this deletion.
      # History: 0 occurrences (46 runs, 3 failures, all pre-write — qa
      # 2026-09-26). Measured severity: 1 port out of 2300–2399 (100), 4
      # live workers.
      #
      # Why this step instead of an automatic retry: see the S6 note above.
      # Why this step prints different text per branch:
      #   * died before Find produced a port → nothing was written (this is
      #     the only shape ever seen); say so, so nobody goes hunting residue.
      #   * Release itself failed → rerunning the SAME deletion replays the
      #     whole chain to clean (rm of the missing container is absorbed by
      #     continue-on-error, --release is idempotent, ledger_remove always
      #     exits 0). Proven by scripts/tests/test-delete-release-port.sh.
      #   * died at/after ledger removal (D3/D4/D5, decided known limits) →
      #     warn that a rerun does NOT heal: Find reads the placeholder,
      #     which is already gone, so the rerun dies at Find. (This corrects
      #     OUT-qa-c3 §1's blanket "rerun heals D2–D5", which holds only for
      #     D2.) Manual path: ledger_remove + `gh variable set POOL_WORKERS`,
      #     dispatch refresh-authorized-keys.yml for the key, and let the next
      #     create/delete/rotate push converge the cache.
      #     Separately: that same refresh workflow also runs on its own daily
      #     schedule (UTC 20:00), so a dispatch you skip still converges the
      #     Gateway's authorized_keys — but it does not touch the state cache,
      #     and not before the next one.
      #
      # This step only prints (log + $GITHUB_STEP_SUMMARY). It runs no ssh,
      # no gh, and cannot fail the run further — a failing failure-handler
      # would confuse attribution, so there is nothing here that can fail.
      - name: On failure, explain the residue and how to recover
        if: failure()
        shell: bash
        env:
          FIND_PORT: ${{ steps.find.outputs.port }}
          FIND_CONTAINER: ${{ steps.find.outputs.container }}
          FIND_PROVIDER: ${{ steps.find.outputs.provider }}
          RM_OUTCOME: ${{ steps.rm_container.outcome }}
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
        run: |
          set -uo pipefail
          display_name="${FIND_CONTAINER:-}"
          [[ -z "${display_name}" && -n "${FIND_PORT:-}" ]] && display_name="worker-${FIND_PORT}"
          {
            echo "### Delete worker failed — residue and recovery"
            echo ""
            if [[ -z "${FIND_PORT:-}" ]]; then
              echo "The run died before anything was written (Validate inputs /"
              echo "List claims / Find claim — the only three failure points ever"
              echo "seen). No container, placeholder, ledger entry, key, or cache"
              echo "entry was touched. Fix the inputs and dispatch again."
            elif [[ "${RELEASE_OUTCOME:-}" == "failure" ]]; then
              echo "Step \`Release the port on the Gateway\` failed. The steps"
              echo "after it were skipped, so the worker is half-deleted:"
              echo ""
              if [[ "${RM_OUTCOME:-}" == "failure" ]]; then
                echo "- container \`${display_name}\` is STILL on \`${FIND_PROVIDER:-}\`"
                echo "  (the provider was unreachable; its pool-sync sweeps"
                echo "  containers the ledger no longer lists on its next boot)."
              else
                echo "- container \`${display_name}\` is removed."
              fi
              echo "- placeholder \`workers.d/${FIND_PORT}.json\` is still on the"
              echo "  Gateway, so port ${FIND_PORT} stays unusable for new workers."
              echo "- POOL_WORKERS still lists port ${FIND_PORT}, the worker key is"
              echo "  still authorized, and the state cache still declares it:"
              echo "  \`mlp state\` looks consistent while \`mlp ls\` shows the"
              echo "  worker as down. The residue IS visible, just not as red."
              echo ""
              echo "Recovery: rerun the SAME deletion. It replays the whole chain;"
              echo "the missing container is absorbed and the release is idempotent:"
              echo ""
              echo "  mlp worker rm '${display_name}'"
              echo "  # or: gh workflow run delete-worker.yml -f port=${FIND_PORT}"
            elif [[ "${RELEASE_OUTCOME:-}" == "success" ]]; then
              echo "The failure happened at or after \`Remove the worker from"
              echo "POOL_WORKERS\` (known limits D3/D4/D5 — deliberately not"
              echo "auto-remedied). The placeholder is already released, so port"
              echo "${FIND_PORT} is reusable, BUT rerunning delete-worker does NOT"
              echo "heal this: Find reads the placeholder, which is gone, so the"
              echo "rerun dies at Find with \"no worker port claim found\"."
              echo "Manual recovery, three copy-pasteable steps (look at step 1"
              echo "output before running step 3 — step 3 is the destructive one):"
              echo "1. cur=\$(gh api \"repos/\${GH_REPO}/actions/variables/POOL_WORKERS\" --jq .value)"
              echo "2. new is the output of: ledger_remove \"\$cur\" \"${FIND_PORT}\""
              echo "   (source scripts/lib/ledger.sh first, in a throwaway shell;"
              echo "   pure function, no network)"
              echo "3. printf '%s' \"\$new\" | gh variable set POOL_WORKERS"
              echo "4. gh workflow run refresh-authorized-keys.yml --repo \${GH_REPO}"
              echo "   (re-authorizes the Gateway without the dead key. Run this step"
              echo "   now — a leftover authorized key is a security issue, not something"
              echo "   to swallow, for the same reason step Refresh above fails the run."
              echo "   Providers only dispatch this when they really wrote a new tunnel"
              echo "   key, so don't count on them picking it up. If you skip this step,"
              echo "   the workflow's own daily schedule (UTC 20:00) does pull the dead"
              echo "   key off eventually — but that can take up to a day. The Gateway's"
              echo "   state cache is separate: only the next create/delete/rotate push"
              echo "   converges it, so 'mlp ls' can still list this worker until then.)"
            else
              echo "The run failed outside the traced steps (cancelled, or a step"
              echo "was skipped before Release ran). Check the log for the first"
              echo "red step. If \`pool-port-alloc --list\` still shows the port,"
              echo "rerunning the deletion heals it:"
              echo ""
              echo "  mlp worker rm '${display_name}'"
            fi
          } | tee -a "${GITHUB_STEP_SUMMARY}"
