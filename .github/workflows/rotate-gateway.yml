name: Rotate Gateway

# spec: docs/POOL_RUNTIME_SPEC.md §9.4 — flow: docs/ARCHITECTURE.md §5
#
# Blue/green rotate of the Gateway Linode. dry_run defaults to true because
# this workflow replaces the one machine every provider tunnels through —
# actually touching NODE_GATEWAY or deleting the live machine requires an
# explicit dry_run: false.
#
# A thin shell: every step here reads/writes vars and secrets, or calls a
# function from scripts/rotate-gateway.sh — the actual flow logic (build
# preview, poll ssh/cloud-init, deploy, promote, roll back, sweep) lives
# there, not in this YAML (docs/LAYOUT.md §3/§4).

on:
  workflow_dispatch:
    inputs:
      type:
        description: Linode plan
        required: false
        default: g6-nanode-1
      region:
        description: Linode region
        required: false
        default: ap-northeast
      image:
        description: Linode image
        required: false
        default: linode/ubuntu24.04
      dry_run:
        description: >-
          true = build + provision + verify a preview machine, then delete
          it. Never touches NODE_GATEWAY or the live machine. false = the
          real rotate.
        required: false
        type: boolean
        default: true

concurrency:
  group: rotate-gateway
  cancel-in-progress: false

permissions:
  contents: read

env:
  GH_TOKEN: ${{ secrets.GH_POOL_TOKEN }}
  GH_REPO: ${{ github.repository }}

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up linode-cli
        uses: linode/action-linode-cli@v1
        with:
          token: ${{ secrets.LINODE_TOKEN }}

      - name: Start ssh-agent, load Actions key
        id: agent
        shell: bash
        env:
          # SSH_KEY_ACTIONS is Actions' one identity across the whole
          # cluster (management access to Gateway and every provider).
          SSH_KEY_ACTIONS: ${{ secrets.SSH_KEY_ACTIONS }}
        run: |
          set -euo pipefail
          eval "$(ssh-agent -s)" >/dev/null
          echo "SSH_AUTH_SOCK=${SSH_AUTH_SOCK}" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=${SSH_AGENT_PID}" >> "$GITHUB_ENV"

          ssh-add - <<< "$SSH_KEY_ACTIONS"

          # Keys never touch disk: derive the public half straight out of
          # the agent instead of writing the private key to a file for
          # `ssh-keygen -y`.
          mapfile -t pubkeys < <(ssh-add -L)
          {
            echo "fatesaikou_pub=${pubkeys[0]}"
          } >> "$GITHUB_OUTPUT"

      - name: Read current Gateway state
        id: read_old_gateway
        shell: bash
        run: |
          set -euo pipefail
          old_json="$(shared-configs/pool-runtime/files/pool-resolve gateway --refresh)"
          printf '%s' "$old_json" > "${RUNNER_TEMP}/old_gateway.json"
          {
            echo "old_ip=$(jq -r '.ip' <<<"$old_json")"
            echo "old_generation=$(jq -r '.generation' <<<"$old_json")"
            echo "old_label=$(jq -r '.linode_label // "fws"' <<<"$old_json")"
            echo "old_host_key=$(jq -r '.host_key // "-"' <<<"$old_json")"
          } >> "$GITHUB_OUTPUT"

      - name: Create preview Gateway
        id: create_preview
        shell: bash
        env:
          FATESAIKOU_PUBKEY: ${{ steps.agent.outputs.fatesaikou_pub }}
          # Optional. Set it and every rotated Gateway keeps the same root
          # password, so the LISH console rescue documented in SECRETS.md
          # stays valid instead of expiring with each rotate. Unset, rotate
          # generates a throwaway one and warns that console rescue is out.
          GATEWAY_ROOT_PASS: ${{ secrets.GATEWAY_ROOT_PASSWORD }}
        run: |
          set -euo pipefail
          command -v envsubst >/dev/null 2>&1 || sudo apt-get install -y gettext-base
          source scripts/rotate-gateway.sh
          source scripts/refresh-authkeys.sh

          # Assemble the two authorized_keys lists from the repo variables
          # (KEY-DESIGN §3.4/§9.7): a rotated Gateway must be born with
          # them already assembled — waiting for a refresh would leave the
          # per-machine tunnel keys missing and the current providers
          # unable to dial in.
          #   login: CLIENT_* via authkeys_assemble (required = Actions)
          #   sshproxy: all tunnel_public_key (NODE_* providers +
          #     POOL_WORKERS workers) — no shared key since KEY-DESIGN §8
          vars_json="$(gh api "repos/${GH_REPO}/actions/variables?per_page=100" --paginate)"
          workers_json="$(gh api "repos/${GH_REPO}/actions/variables/POOL_WORKERS" --jq .value 2>/dev/null || echo '[]')"

          clients="$(refresh_collect_clients "$vars_json")"
          actions_pk="$(printf '%s' "$clients" | jq -r '.[] | select(.name == "actions") | .public_key // empty' 2>/dev/null || true)"
          if [[ -z "$actions_pk" ]]; then
            echo "::error::CLIENT_ACTIONS is missing — cannot assemble a login list that provably keeps Actions in. Refusing to build the Gateway."
            exit 1
          fi
          login_keys="$(rotate_assemble_login_keys "$clients" "$actions_pk")" || {
            echo "::error::login list assembly failed — aborting (self-lockout guard)"
            exit 1
          }

          tunnel_keys="$(refresh_collect_tunnel_keys "$vars_json" "$workers_json")"
          sshproxy_keys="$(rotate_assemble_sshproxy_keys "$tunnel_keys")" || {
            echo "::error::sshproxy list assembly failed — aborting (empty-list guard)"
            exit 1
          }

          rendered="${RUNNER_TEMP}/cloud-config.yaml"
          rotate_render_cloud_config profiles/gateway/default/cloud-config.yaml \
              "$login_keys" "$sshproxy_keys" > "$rendered"

          # The rendered file must be valid YAML: ssh_authorized_keys
          # expanded to several items, so a broken expansion fails the
          # rotate BEFORE any machine is built.
          python3 -c "import yaml; yaml.safe_load(open('$rendered'))" || {
            echo "::error::rendered cloud-config is not valid YAML — refusing to create the preview"
            exit 1
          }

          output="$(rotate_create_preview_linode "${{ inputs.region }}" "${{ inputs.type }}" "${{ inputs.image }}" "$rendered")" || {
            echo "::error::could not create the preview Gateway — see log above"
            exit 1
          }
          # This step's stdout contract is "KEY=value lines only". Dumping
          # it unconditionally into $GITHUB_OUTPUT turns any stray log line
          # into a hard Actions parse error three screens away from its
          # cause (2026-09-25: one log INFO on stdout, only reachable once
          # GATEWAY_ROOT_PASSWORD was set — the other branch logged WARN to
          # stderr). Filtering silently would hide that pollution; failing
          # loudly turns it back into a bug report naming the offending
          # line, which is what a broken contract should produce.
          filtered=""
          while IFS= read -r line; do
            [[ -z "$line" ]] && continue
            if [[ "$line" =~ ^[A-Za-z_][A-Za-z0-9_]*= ]]; then
              filtered+="${line}"$'\n'
            else
              echo "::error::rotate_create_preview_linode wrote a non-KEY=value line to stdout (contract: stdout is the return value): ${line}"
              exit 1
            fi
          done <<< "$output"
          printf '%s' "$filtered" >> "$GITHUB_OUTPUT"
          preview_ip="$(printf '%s\n' "$output" | grep '^preview_ip=' | cut -d= -f2)"
          echo "::notice::created preview Gateway (${preview_ip})"

      - name: Wait for preview to boot
        shell: bash
        env:
          PREVIEW_IP: ${{ steps.create_preview.outputs.preview_ip }}
        run: |
          set -euo pipefail
          source scripts/rotate-gateway.sh

          rotate_wait_for_ssh fatesaikou "$PREVIEW_IP" || { echo "::error::preview machine never became reachable over ssh"; exit 1; }

          # `rc=0; ... || rc=$?` — same F1 trap as the cleanup step: this
          # runs under `set -euo pipefail`, and rotate_wait_for_cloud_init
          # returns 1 for BOTH "timeout" and "failed" so the case below can
          # tell them apart. Without the guard, a failed/timed-out
          # cloud-init aborts the step at the assignment, the case never
          # runs, and the user gets a shell abort instead of the specific
          # "did not finish within 10 minutes" / "cloud-init failed"
          # message (2026-09-25 qa F1's shape, second site).
          rc=0
          status="$(rotate_wait_for_cloud_init fatesaikou "$PREVIEW_IP" | tee /dev/stderr | tail -1)" || rc=$?
          case "$status" in
            STATUS=clean) ;;
            STATUS=degraded) echo "::warning::cloud-init finished in a degraded state (recoverable errors) — see log above" ;;
            STATUS=timeout) echo "::error::cloud-init did not finish within 10 minutes"; exit 1 ;;
            *) echo "::error::cloud-init failed — see log above"; exit 1 ;;
          esac

      # Units now own their files/ (still *.crypted — decryption happens
      # per-unit, on the Gateway, inside provision-gateway.sh's own
      # unit-install calls) instead of this step flattening/decrypting
      # everything onto a bare /home tree itself. This is more than a path
      # swap: each unit's install.sh resolves its files/ and
      # scripts/lib/crypto.sh relative to its own location under
      # shared-configs/, so the whole tree (plus scripts/, which every
      # unit's decrypt step depends on) has to land together at the same
      # path provision-gateway.sh expects
      # (REPO_DIR=/home/fatesaikou/.mylinuxpool/repo) — copying it there
      # still-encrypted, rather than pre-decrypting on the runner, is what
      # lets provision-gateway.sh just call each unit's install.sh
      # unmodified.
      - name: Deploy shared-configs + scripts to the Gateway
        shell: bash
        env:
          PREVIEW_IP: ${{ steps.create_preview.outputs.preview_ip }}
        run: |
          set -euo pipefail
          source scripts/rotate-gateway.sh
          rotate_deploy_repo_bundle fatesaikou "$PREVIEW_IP"

      # Both numbers come from NODE_GATEWAY, the same variable clients read,
      # so the machine and its clients cannot disagree about the port.
      #   ssh_port      — the single port clients connect to (.port)
      #   listen_ports  — what the machine binds; a superset only while a
      #                   port move is in flight
      - name: Read the Gateway's SSH port from NODE_GATEWAY
        id: listen
        shell: bash
        run: |
          set -euo pipefail
          gw_json="$(gh api "repos/${GH_REPO}/actions/variables/NODE_GATEWAY" --jq .value)"
          {
            echo "ssh_port=$(printf '%s' "$gw_json" | jq -r '.port // 22')"
            echo "listen_ports=$(printf '%s' "$gw_json" \
              | jq -r '(.ssh_listen_ports // [(.port // 22)]) | map(tostring) | join(" ")')"
          } >> "$GITHUB_OUTPUT"

      - name: Run provision-gateway.sh on preview
        id: provision
        shell: bash
        env:
          FILE_CRYPTO_KEY: ${{ secrets.FILE_CRYPTO_KEY }}
          PREVIEW_IP: ${{ steps.create_preview.outputs.preview_ip }}
        run: |
          set -euo pipefail
          source scripts/rotate-gateway.sh
          trusted_ips="$(gh variable get POOL_TRUSTED_IPS --repo "$GH_REPO")"
          # The key never gets logged: no -x, and GitHub Actions masks the
          # exact secret value in any log line regardless.
          # The preview is still reached on the port a fresh Linode boots
          # with (22); provisioning only changes what it listens on at the
          # end, so the session making the change is never cut off by it.
          # Everything AFTER this step must use steps.listen.outputs.ssh_port.
          rotate_run_provision fatesaikou "$PREVIEW_IP" "$trusted_ips" "$FILE_CRYPTO_KEY" \
            "${{ steps.listen.outputs.listen_ports }}"

      # The check that was missing. A rotate used to switch NODE_GATEWAY
      # and only then discover whether providers could attach; when they
      # couldn't, that was three minutes of no tunnels before the
      # rollback. Ask one provider first, while the live Gateway is still
      # in charge, and a bad machine costs nothing.
      #
      # Runs on dry runs too — proving a preview is reachable by a real
      # provider is most of what a dry run is for.
      # Which providers are actually attached right now, decided against the
      # CURRENT Gateway before anything changes. fh-l is a desktop that is
      # normally asleep, so "every registered provider" is the wrong set
      # both for choosing where to probe from and for deciding who has to
      # come back afterwards.
      - name: Determine which providers are attached
        id: live
        shell: bash
        env:
          OLD_IP: ${{ steps.read_old_gateway.outputs.old_ip }}
          OLD_HOST_KEY: ${{ steps.read_old_gateway.outputs.old_host_key }}
        run: |
          set -euo pipefail
          source scripts/rotate-gateway.sh

          mapfile -t specs < <(gh api "repos/${GH_REPO}/actions/variables" --paginate --jq \
            '.variables[] | select(.name | startswith("NODE_")) | .value | fromjson
             | select(.role == "provider") | "\(.name):\(.gateway_port)"')

          if (( ${#specs[@]} == 0 )); then
            echo "::warning::no role=provider nodes registered"
            { echo "ports="; echo "probe_node="; } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Keep only well-formed "<name> <port>" lines. Anything else on
          # stdout is not a provider, and silently treating it as one is how
          # a stray log line became the probe target once already.
          live="$(rotate_live_providers fatesaikou "$OLD_IP" "$OLD_HOST_KEY" "${{ steps.listen.outputs.ssh_port }}" "${specs[@]}" \
                  | grep -E '^[A-Za-z0-9][A-Za-z0-9._-]* [0-9]+$' || true)"
          ports="$(awk '{print $2}' <<<"$live" | tr '\n' ' ' | sed 's/ $//')"
          node="$(awk 'NR==1{print $1}' <<<"$live")"

          echo "attached: ${live:-<none>}"
          { echo "ports=${ports}"; echo "probe_node=${node}"; } >> "$GITHUB_OUTPUT"

          if [[ -z "$node" ]]; then
            echo "::warning::no provider is currently attached — the tunnel probe will be skipped and nothing will be waited for"
          fi

      - name: Read the new Gateway's host key
        id: hostkey
        shell: bash
        env:
          PREVIEW_IP: ${{ steps.create_preview.outputs.preview_ip }}
        run: |
          set -euo pipefail
          source scripts/rotate-gateway.sh
          # Read over the session that just provisioned it, then carry it
          # in NODE_GATEWAY so providers verify the machine instead of
          # trusting whatever answers on a recycled address.
          key="$(rotate_read_host_key fatesaikou "$PREVIEW_IP" "${{ steps.listen.outputs.ssh_port }}")"
          echo "key=${key}" >> "$GITHUB_OUTPUT"
          if [[ -z "$key" ]]; then
            echo "::warning::could not read the new Gateway's host key; providers will fall back to trust-on-first-use"
          fi

      - name: Probe a real provider tunnel into the new Gateway
        id: probe
        shell: bash
        env:
          PREVIEW_IP: ${{ steps.create_preview.outputs.preview_ip }}
          HOST_KEY: ${{ steps.hostkey.outputs.key }}
        run: |
          set -euo pipefail
          source scripts/rotate-gateway.sh
          cmd="$(rotate_build_tunnel_probe_cmd "$PREVIEW_IP" sshproxy 2999 "$HOST_KEY" "${{ steps.listen.outputs.ssh_port }}")"
          echo "cmd=${cmd}" >> "$GITHUB_OUTPUT"

      - name: Run the probe on a provider that is attached
        id: probe_run
        if: steps.live.outputs.probe_node != ''
        continue-on-error: true
        # pool-ssh resolves the hop chain and looks each hop's key_secret
        # up as an env var. The rest of this workflow reaches machines
        # through the ssh-agent started above, so the variable was never
        # exported and the probe failed before it could even try.
        env:
          SSH_KEY_ACTIONS: ${{ secrets.SSH_KEY_ACTIONS }}
        uses: ./.github/actions/pool-ssh
        with:
          node: ${{ steps.live.outputs.probe_node }}
          command: ${{ steps.probe.outputs.cmd }}
          timeout: 30

      - name: Fail the rotate if the probe could not build a tunnel
        shell: bash
        env:
          OUTCOME: ${{ steps.probe_run.outcome }}
          PROBE_NODE: ${{ steps.live.outputs.probe_node }}
        run: |
          set -euo pipefail
          if [[ -z "$PROBE_NODE" ]]; then
            echo "::warning::no provider was attached, so nothing could verify the new Gateway from a provider's side"
            exit 0
          fi
          if [[ "$OUTCOME" != "success" ]]; then
            echo "::error::a provider could not build a reverse tunnel into the new Gateway — see the probe step's log for ssh's own message. NODE_GATEWAY was NOT switched; the live Gateway is untouched."
            exit 1
          fi
          echo "provider tunnel probe succeeded"

      # The ledger used to be copied off the outgoing Gateway here. It has
      # a master now (POOL_WORKERS), so the new machine is filled from the
      # repo instead — which also works when the old Gateway is unreachable,
      # the very situation that most often prompts a rotate.
      - name: Push the state cache to the new Gateway
        uses: ./.github/actions/push-state
        with:
          gateway-ip: ${{ steps.create_preview.outputs.preview_ip }}
          # The preview has already been provisioned by now, so it listens on
          # NODE_GATEWAY's port, not the 22 a fresh Linode boots with.
          gateway-port: ${{ steps.listen.outputs.ssh_port }}
          host-key: ${{ steps.hostkey.outputs.key }}
          source: rotate-gateway#${{ github.run_id }}
          ssh-key: ${{ secrets.SSH_KEY_ACTIONS }}

      # Restore the Gateway-local placeholder cache from the master, so
      # pool-port-alloc will not hand out a port a running worker still owns.
      # Targets the preview machine by IP, not `node: gateway` — at this
      # point NODE_GATEWAY still names the OUTGOING machine, so resolving
      # by node would restore the claims onto the one being replaced.
      - name: Restore worker port claims from POOL_WORKERS
        shell: bash
        env:
          PREVIEW_IP: ${{ steps.create_preview.outputs.preview_ip }}
        run: |
          set -euo pipefail
          # Post-provisioning, so the preview listens on NODE_GATEWAY's port
          # rather than the 22 it booted with.
          ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=10 \
              -p "${{ steps.listen.outputs.ssh_port }}" \
              "fatesaikou@${PREVIEW_IP}" bash -s <<'REMOTE'
          set -euo pipefail
          mkdir -p ~/.mylinuxpool/workers.d
          jq -c '.workers[]' /var/lib/mylinuxpool/state.json | while read -r w; do
              port="$(printf '%s' "$w" | jq -r .port)"
              printf '%s\n' "$w" > ~/.mylinuxpool/workers.d/"${port}".json
          done
          echo "restored $(ls ~/.mylinuxpool/workers.d/*.json 2>/dev/null | wc -l) claim(s)"
          REMOTE

      - name: Switch NODE_GATEWAY to the new Gateway
        id: switch_point
        if: inputs.dry_run == false
        shell: bash
        env:
          PREVIEW_IP: ${{ steps.create_preview.outputs.preview_ip }}
          HOST_KEY: ${{ steps.hostkey.outputs.key }}
        run: |
          set -euo pipefail
          source scripts/rotate-gateway.sh
          old_json="$(cat "${RUNNER_TEMP}/old_gateway.json")"
          new_gen=$(( ${{ steps.read_old_gateway.outputs.old_generation }} + 1 ))
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          new_json="$(rotate_compute_new_gateway_json "$old_json" "$PREVIEW_IP" "$new_gen" "$now" "$HOST_KEY")"
          printf '%s' "$new_json" | gh variable set NODE_GATEWAY --repo "$GH_REPO"
          echo "switched=true" >> "$GITHUB_OUTPUT"
          echo "::notice::NODE_GATEWAY switched to ${PREVIEW_IP} (generation ${new_gen})"

      - name: Wait for providers to reconnect
        if: inputs.dry_run == false
        shell: bash
        env:
          PREVIEW_IP: ${{ steps.create_preview.outputs.preview_ip }}
          LIVE_PORTS: ${{ steps.live.outputs.ports }}
        run: |
          set -euo pipefail
          source scripts/rotate-gateway.sh
          # Only the providers that were attached before the switch. Waiting
          # for every registered provider means a rotate can never succeed
          # unless the whole fleet is powered on, and fh-l normally is not.
          read -r -a ports <<< "${LIVE_PORTS}"
          if (( ${#ports[@]} == 0 )); then
            echo "::warning::no provider was attached before the switch — nothing to wait for"
            exit 0
          fi
          echo "waiting only for the providers that were attached: ${ports[*]}"

          if ! rotate_wait_for_providers fatesaikou "$PREVIEW_IP" "${{ steps.listen.outputs.ssh_port }}" 180 "${ports[@]}"; then
            echo "::error::providers never came back — see log above"
            exit 1
          fi

      - name: Promote preview to permanent Gateway
        if: inputs.dry_run == false && success()
        shell: bash
        run: |
          set -euo pipefail
          source scripts/rotate-gateway.sh
          old_label="${{ steps.read_old_gateway.outputs.old_label }}"
          preview_id="${{ steps.create_preview.outputs.preview_id }}"

          rotate_promote_preview "$old_label" "$preview_id"

          current_json="$(gh api "repos/${GH_REPO}/actions/variables/NODE_GATEWAY" --jq .value)"
          final_json="$(jq -n --argjson existing "$current_json" --arg label "$old_label" \
            '$existing * {linode_label: $label}')"
          printf '%s' "$final_json" | gh variable set NODE_GATEWAY --repo "$GH_REPO"

          echo "::notice::rotate complete — new Gateway promoted to label '${old_label}'"

      - name: Rollback NODE_GATEWAY (failure after the switch point)
        if: failure() && steps.switch_point.outputs.switched == 'true'
        shell: bash
        run: |
          set -uo pipefail
          source scripts/rotate-gateway.sh
          old_json="$(cat "${RUNNER_TEMP}/old_gateway.json")"
          old_ip="${{ steps.read_old_gateway.outputs.old_ip }}"
          preview_ip="${{ steps.create_preview.outputs.preview_ip }}"

          # Never point NODE_GATEWAY at a machine that is not there. If the
          # failure happened during promote, the old machine is already
          # deleted; writing its ip back makes the var (and every guard that
          # reads it, cleanup included) lie — which is how a half-finished
          # promote emptied the pool (2026-09-25 qa F3). Verify first.
          exist_rc=0
          rotate_machine_exists "$old_ip" || exist_rc=$?
          if [[ "$exist_rc" -eq 1 || "$exist_rc" -eq 2 ]]; then
            echo "::error::NOT rolling back: the previous Gateway (${old_ip}) is $( [[ "$exist_rc" -eq 1 ]] && echo 'GONE — promote deleted it' || echo 'unverifiable — the Linode list could not be read' ). NODE_GATEWAY still points at ${preview_ip}, which is the machine still standing."
            if [[ "$exist_rc" -eq 1 ]]; then
              echo "::error::the preview (${preview_ip}) is now the only Gateway. If its port is up, leave NODE_GATEWAY as it is and fix the label by hand; the cleanup step will refuse to delete it because the var points at it."
              exit 1
            fi
            echo "::warning::could not verify the old machine, so the var was left untouched (pointing at ${preview_ip}) rather than rewritten to an unverified address"
            exit 1
          fi

          rc=0
          printf '%s' "$old_json" | gh variable set NODE_GATEWAY --repo "$GH_REPO" || rc=$?
          if [[ "$rc" -eq 0 ]]; then
            echo "::error::rotate failed after switching — NODE_GATEWAY rolled back to the previous Gateway (ip ${old_ip}, generation ${{ steps.read_old_gateway.outputs.old_generation }})"
          else
            echo "::error::ROLLBACK FAILED — NODE_GATEWAY may still point at the dead preview (${preview_ip})! Manual fix required NOW: gh variable set NODE_GATEWAY --repo ${GH_REPO} with ip=${old_ip} generation=${{ steps.read_old_gateway.outputs.old_generation }}"
            exit 1
          fi

      # Runs even when steps.create_preview.outputs.preview_id is empty:
      # the machine exists in the cloud regardless of whether the output
      # that was supposed to name it got written (2026-09-25 — the id was
      # lost to a stdout bug, this step was skipped by its old `preview_id
      # != ''` condition, and the machine billed until the 2h sweep).
      # rotate_cleanup_preview takes the id when present (fast, exact) and
      # falls back to the fixed `fws-preview` label otherwise.
      #
      # The protected ip is NODE_GATEWAY's CURRENT address, read live: after
      # a real rotate that failed past the switch point, the preview IS the
      # live Gateway, and this step must not delete it. Reading live (rather
      # than passing a step output) also covers a failed rollback: the var
      # still points at the preview, so protection engages.
      - name: Clean up preview machine (dry run, or any failure before promotion)
        if: always() && (inputs.dry_run == true || failure())
        shell: bash
        run: |
          source scripts/rotate-gateway.sh
          # Read the machine NODE_GATEWAY currently points at. If that read
          # FAILS we pass the UNKNOWN sentinel, never an empty string: empty
          # means "no protection asserted" (dry run), and conflating the two
          # made the guard fail open exactly when it mattered — a gh hiccup
          # during an already-failing rotate deleted the sole surviving
          # machine (2026-09-25 qa F2).
          protected_ip="$(gh api "repos/${GH_REPO}/actions/variables/NODE_GATEWAY" --jq .value 2>/dev/null | jq -r '.ip // empty' 2>/dev/null)" \
            || protected_ip="$ROTATE_PROTECT_UNKNOWN"
          [[ -n "$protected_ip" ]] || protected_ip="$ROTATE_PROTECT_UNKNOWN"
          # `rc=0; fn || rc=$?` — NOT a bare call. This step runs under
          # `bash -eo pipefail` (GitHub's default), where a bare non-zero
          # return aborts the step and makes the `case $?` below dead code:
          # none of these warnings would ever print (2026-09-25 qa F1).
          rc=0
          rotate_cleanup_preview "${{ steps.create_preview.outputs.preview_id }}" "$protected_ip" || rc=$?
          case "$rc" in
            0) ;;
            4) echo "::warning::refused to delete the preview because NODE_GATEWAY still points at it — clean up by hand once the rollback is sorted" ;;
            2) echo "::warning::could not delete preview linode — the Linode list could not be read, so nothing was deleted (NOT verified as absent); the orphan sweep will catch it after 2h" ;;
            *) echo "::warning::could not delete preview linode — the orphan sweep will catch it after 2h" ;;
          esac

      - name: Orphan sweep (delete stale *-preview machines)
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          source scripts/rotate-gateway.sh
          # Pass NODE_GATEWAY's CURRENT address so the sweep cannot delete a
          # live Gateway that is still wearing the preview label (a rotate
          # that died between the switch and the relabel). Same sentinel
          # discipline as the cleanup step: an unreadable var means the
          # machine to protect is unknown, and the sweep then deletes
          # nothing (2026-09-25 qa F5).
          protected_ip="$(gh api "repos/${GH_REPO}/actions/variables/NODE_GATEWAY" --jq .value 2>/dev/null | jq -r '.ip // empty' 2>/dev/null)" \
            || protected_ip="$ROTATE_PROTECT_UNKNOWN"
          [[ -n "$protected_ip" ]] || protected_ip="$ROTATE_PROTECT_UNKNOWN"
          rc=0
          rotate_orphan_sweep 7200 "$protected_ip" || rc=$?
          [[ "$rc" -eq 0 ]] || echo "::warning::orphan sweep exited ${rc} — some machines may not have been checked"

      - name: Stop ssh-agent
        if: always()
        shell: bash
        run: ssh-agent -k >/dev/null 2>&1 || true
