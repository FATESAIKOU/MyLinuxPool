name: Rotate Gateway

# spec: docs/POOL_RUNTIME_SPEC.md §9.4 — flow: docs/ARCHITECTURE.md §5
#
# Blue/green rotate of the Gateway Linode. dry_run defaults to true because
# this workflow replaces the one machine every provider tunnels through —
# actually touching NODE_GATEWAY or deleting the live machine requires an
# explicit dry_run: false.
#
# A thin shell: every step here reads/writes vars and secrets, or calls a
# function from scripts/rotate-gateway.sh — the actual flow logic (build
# preview, poll ssh/cloud-init, deploy, promote, roll back, sweep) lives
# there, not in this YAML (docs/LAYOUT.md §3/§4).

on:
  workflow_dispatch:
    inputs:
      type:
        description: Linode plan
        required: false
        default: g6-nanode-1
      region:
        description: Linode region
        required: false
        default: ap-northeast
      image:
        description: Linode image
        required: false
        default: linode/ubuntu24.04
      dry_run:
        description: >-
          true = build + provision + verify a preview machine, then delete
          it. Never touches NODE_GATEWAY or the live machine. false = the
          real rotate.
        required: false
        type: boolean
        default: true

concurrency:
  group: rotate-gateway
  cancel-in-progress: false

permissions:
  contents: read

env:
  GH_TOKEN: ${{ secrets.GH_POOL_TOKEN }}
  GH_REPO: ${{ github.repository }}

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up linode-cli
        uses: linode/action-linode-cli@v1
        with:
          token: ${{ secrets.LINODE_TOKEN }}

      - name: Start ssh-agent, load Actions key + decrypted tunnel key
        id: agent
        shell: bash
        env:
          # SSH_KEY_ACTIONS is Actions' one identity across the whole
          # cluster (management access to Gateway and every provider) —
          # not to be confused with the tunnel identity below, which
          # providers/workers use to reverse-tunnel in.
          SSH_KEY_ACTIONS: ${{ secrets.SSH_KEY_ACTIONS }}
          # The tunnel identity is not a secret of its own: it already
          # ships in the repo as ssh-tunnel-client/files/id_rsa.crypted,
          # and Actions holds the key that opens it. One fewer secret to
          # keep in sync with the .crypted file it duplicated.
          FILE_CRYPTO_KEY: ${{ secrets.FILE_CRYPTO_KEY }}
        run: |
          set -euo pipefail
          eval "$(ssh-agent -s)" >/dev/null
          echo "SSH_AUTH_SOCK=${SSH_AUTH_SOCK}" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=${SSH_AGENT_PID}" >> "$GITHUB_ENV"

          ssh-add - <<< "$SSH_KEY_ACTIONS"
          scripts/lib/crypto.sh decrypt "$FILE_CRYPTO_KEY" \
            < shared-configs/ssh-tunnel-client/files/id_rsa.crypted | ssh-add -

          # Keys never touch disk: derive each public half straight out of
          # the agent instead of writing the private key to a file for
          # `ssh-keygen -y`. Order matches the two ssh-add calls above.
          mapfile -t pubkeys < <(ssh-add -L)
          {
            echo "fatesaikou_pub=${pubkeys[0]}"
            echo "sshproxy_pub=${pubkeys[1]}"
          } >> "$GITHUB_OUTPUT"

      - name: Read current Gateway state
        id: read_old_gateway
        shell: bash
        run: |
          set -euo pipefail
          old_json="$(shared-configs/pool-runtime/files/pool-resolve gateway --refresh)"
          printf '%s' "$old_json" > "${RUNNER_TEMP}/old_gateway.json"
          {
            echo "old_ip=$(jq -r '.ip' <<<"$old_json")"
            echo "old_generation=$(jq -r '.generation' <<<"$old_json")"
            echo "old_label=$(jq -r '.linode_label // "fws"' <<<"$old_json")"
          } >> "$GITHUB_OUTPUT"

      - name: Create preview Gateway
        id: create_preview
        shell: bash
        env:
          FATESAIKOU_PUBKEY: ${{ steps.agent.outputs.fatesaikou_pub }}
          SSHPROXY_PUBKEY: ${{ steps.agent.outputs.sshproxy_pub }}
          # Optional. Set it and every rotated Gateway keeps the same root
          # password, so the LISH console rescue documented in SECRETS.md
          # stays valid instead of expiring with each rotate. Unset, rotate
          # generates a throwaway one and warns that console rescue is out.
          GATEWAY_ROOT_PASS: ${{ secrets.GATEWAY_ROOT_PASSWORD }}
        run: |
          set -euo pipefail
          command -v envsubst >/dev/null 2>&1 || sudo apt-get install -y gettext-base
          source scripts/rotate-gateway.sh

          rendered="${RUNNER_TEMP}/cloud-config.yaml"
          rotate_render_cloud_config profiles/gateway/default/cloud-config.yaml \
              "$FATESAIKOU_PUBKEY" "$SSHPROXY_PUBKEY" > "$rendered"

          output="$(rotate_create_preview_linode "${{ inputs.region }}" "${{ inputs.type }}" "${{ inputs.image }}" "$rendered")" || {
            echo "::error::could not create the preview Gateway — see log above"
            exit 1
          }
          echo "$output" >> "$GITHUB_OUTPUT"
          preview_ip="$(printf '%s\n' "$output" | grep '^preview_ip=' | cut -d= -f2)"
          echo "::notice::created preview Gateway (${preview_ip})"

      - name: Wait for preview to boot
        shell: bash
        env:
          PREVIEW_IP: ${{ steps.create_preview.outputs.preview_ip }}
        run: |
          set -euo pipefail
          source scripts/rotate-gateway.sh

          rotate_wait_for_ssh fatesaikou "$PREVIEW_IP" || { echo "::error::preview machine never became reachable over ssh"; exit 1; }

          status="$(rotate_wait_for_cloud_init fatesaikou "$PREVIEW_IP" | tee /dev/stderr | tail -1)"
          case "$status" in
            STATUS=clean) ;;
            STATUS=degraded) echo "::warning::cloud-init finished in a degraded state (recoverable errors) — see log above" ;;
            STATUS=timeout) echo "::error::cloud-init did not finish within 10 minutes"; exit 1 ;;
            *) echo "::error::cloud-init failed — see log above"; exit 1 ;;
          esac

      # Units now own their files/ (still *.crypted — decryption happens
      # per-unit, on the Gateway, inside provision-gateway.sh's own
      # unit-install calls) instead of this step flattening/decrypting
      # everything onto a bare /home tree itself. This is more than a path
      # swap: each unit's install.sh resolves its files/ and
      # scripts/lib/crypto.sh relative to its own location under
      # shared-configs/, so the whole tree (plus scripts/, which every
      # unit's decrypt step depends on) has to land together at the same
      # path provision-gateway.sh expects
      # (REPO_DIR=/home/fatesaikou/.mylinuxpool/repo) — copying it there
      # still-encrypted, rather than pre-decrypting on the runner, is what
      # lets provision-gateway.sh just call each unit's install.sh
      # unmodified.
      - name: Deploy shared-configs + scripts to the Gateway
        shell: bash
        env:
          PREVIEW_IP: ${{ steps.create_preview.outputs.preview_ip }}
        run: |
          set -euo pipefail
          source scripts/rotate-gateway.sh
          rotate_deploy_repo_bundle fatesaikou "$PREVIEW_IP"

      - name: Run provision-gateway.sh on preview
        id: provision
        shell: bash
        env:
          FILE_CRYPTO_KEY: ${{ secrets.FILE_CRYPTO_KEY }}
          PREVIEW_IP: ${{ steps.create_preview.outputs.preview_ip }}
        run: |
          set -euo pipefail
          source scripts/rotate-gateway.sh
          trusted_ips="$(gh variable get POOL_TRUSTED_IPS --repo "$GH_REPO")"
          # The key never gets logged: no -x, and GitHub Actions masks the
          # exact secret value in any log line regardless.
          rotate_run_provision fatesaikou "$PREVIEW_IP" "$trusted_ips" "$FILE_CRYPTO_KEY"

      # The check that was missing. A rotate used to switch NODE_GATEWAY
      # and only then discover whether providers could attach; when they
      # couldn't, that was three minutes of no tunnels before the
      # rollback. Ask one provider first, while the live Gateway is still
      # in charge, and a bad machine costs nothing.
      #
      # Runs on dry runs too — proving a preview is reachable by a real
      # provider is most of what a dry run is for.
      - name: Probe a real provider tunnel into the new Gateway
        id: probe
        shell: bash
        env:
          PREVIEW_IP: ${{ steps.create_preview.outputs.preview_ip }}
        run: |
          set -euo pipefail
          source scripts/rotate-gateway.sh
          cmd="$(rotate_build_tunnel_probe_cmd "$PREVIEW_IP" sshproxy 2999)"
          echo "cmd=${cmd}" >> "$GITHUB_OUTPUT"

      - name: Run the probe on fh-l
        id: probe_run
        continue-on-error: true
        # pool-ssh resolves the hop chain and looks each hop's key_secret
        # up as an env var. The rest of this workflow reaches machines
        # through the ssh-agent started above, so the variable was never
        # exported and the probe failed before it could even try.
        env:
          SSH_KEY_ACTIONS: ${{ secrets.SSH_KEY_ACTIONS }}
        uses: ./.github/actions/pool-ssh
        with:
          node: fh-l
          command: ${{ steps.probe.outputs.cmd }}
          timeout: 30

      - name: Fail the rotate if the probe could not build a tunnel
        shell: bash
        env:
          OUTCOME: ${{ steps.probe_run.outcome }}
        run: |
          set -euo pipefail
          if [[ "$OUTCOME" != "success" ]]; then
            echo "::error::a provider could not build a reverse tunnel into the new Gateway — see the probe step's log for ssh's own message. NODE_GATEWAY was NOT switched; the live Gateway is untouched."
            exit 1
          fi
          echo "provider tunnel probe succeeded"

      # Before the switch, so a failure here still leaves the live Gateway
      # in charge. Runs on dry runs too — the copy targets the preview
      # machine that is about to be deleted, so it costs nothing and keeps
      # the step exercised instead of only ever running for real.
      - name: Carry worker port claims to the new Gateway
        shell: bash
        env:
          PREVIEW_IP: ${{ steps.create_preview.outputs.preview_ip }}
          OLD_IP: ${{ steps.read_old_gateway.outputs.old_ip }}
        run: |
          set -euo pipefail
          source scripts/rotate-gateway.sh
          rotate_carry_worker_claims fatesaikou "$OLD_IP" "$PREVIEW_IP"

      - name: Switch NODE_GATEWAY to the new Gateway
        id: switch_point
        if: inputs.dry_run == false
        shell: bash
        env:
          PREVIEW_IP: ${{ steps.create_preview.outputs.preview_ip }}
        run: |
          set -euo pipefail
          source scripts/rotate-gateway.sh
          old_json="$(cat "${RUNNER_TEMP}/old_gateway.json")"
          new_gen=$(( ${{ steps.read_old_gateway.outputs.old_generation }} + 1 ))
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # Carried in NODE_GATEWAY so providers verify the machine rather
          # than trusting whatever answers on a recycled address.
          host_key="$(rotate_read_host_key fatesaikou "$PREVIEW_IP")"
          new_json="$(rotate_compute_new_gateway_json "$old_json" "$PREVIEW_IP" "$new_gen" "$now" "$host_key")"
          printf '%s' "$new_json" | gh variable set NODE_GATEWAY --repo "$GH_REPO"
          echo "switched=true" >> "$GITHUB_OUTPUT"
          echo "::notice::NODE_GATEWAY switched to ${PREVIEW_IP} (generation ${new_gen})"

      - name: Wait for providers to reconnect
        if: inputs.dry_run == false
        shell: bash
        env:
          PREVIEW_IP: ${{ steps.create_preview.outputs.preview_ip }}
        run: |
          set -euo pipefail
          source scripts/rotate-gateway.sh
          ports_json="$(gh api "repos/${GH_REPO}/actions/variables" --paginate --jq \
            '[.variables[] | select(.name | startswith("NODE_")) | .value | fromjson | select(.role == "provider") | .gateway_port]')"

          mapfile -t ports < <(jq -r '.[]' <<<"$ports_json")
          if (( ${#ports[@]} == 0 )); then
            echo "::warning::no role=provider nodes found in NODE_* vars — nothing to wait for"
            exit 0
          fi

          if ! rotate_wait_for_providers fatesaikou "$PREVIEW_IP" 180 "${ports[@]}"; then
            echo "::error::providers never came back — see log above"
            exit 1
          fi

      - name: Promote preview to permanent Gateway
        if: inputs.dry_run == false && success()
        shell: bash
        run: |
          set -euo pipefail
          source scripts/rotate-gateway.sh
          old_label="${{ steps.read_old_gateway.outputs.old_label }}"
          preview_id="${{ steps.create_preview.outputs.preview_id }}"

          rotate_promote_preview "$old_label" "$preview_id"

          current_json="$(gh api "repos/${GH_REPO}/actions/variables/NODE_GATEWAY" --jq .value)"
          final_json="$(jq -n --argjson existing "$current_json" --arg label "$old_label" \
            '$existing * {linode_label: $label}')"
          printf '%s' "$final_json" | gh variable set NODE_GATEWAY --repo "$GH_REPO"

          echo "::notice::rotate complete — new Gateway promoted to label '${old_label}'"

      - name: Rollback NODE_GATEWAY (failure after the switch point)
        if: failure() && steps.switch_point.outputs.switched == 'true'
        shell: bash
        run: |
          old_json="$(cat "${RUNNER_TEMP}/old_gateway.json")"
          if printf '%s' "$old_json" | gh variable set NODE_GATEWAY --repo "$GH_REPO"; then
            echo "::error::rotate failed after switching — NODE_GATEWAY rolled back to the previous Gateway (ip ${{ steps.read_old_gateway.outputs.old_ip }}, generation ${{ steps.read_old_gateway.outputs.old_generation }})"
          else
            echo "::error::ROLLBACK FAILED — NODE_GATEWAY may still point at the dead preview (${{ steps.create_preview.outputs.preview_ip }})! Manual fix required NOW: gh variable set NODE_GATEWAY --repo ${GH_REPO} with ip=${{ steps.read_old_gateway.outputs.old_ip }} generation=${{ steps.read_old_gateway.outputs.old_generation }}"
            exit 1
          fi

      - name: Clean up preview machine (dry run, or any failure before promotion)
        if: always() && steps.create_preview.outputs.preview_id != '' && (inputs.dry_run == true || failure())
        shell: bash
        run: |
          source scripts/rotate-gateway.sh
          rotate_cleanup_preview "${{ steps.create_preview.outputs.preview_id }}" \
            || echo "::warning::could not delete preview linode — the orphan sweep will catch it after 2h"

      - name: Orphan sweep (delete stale *-preview machines)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          source scripts/rotate-gateway.sh
          rotate_orphan_sweep

      - name: Stop ssh-agent
        if: always()
        shell: bash
        run: ssh-agent -k >/dev/null 2>&1 || true
