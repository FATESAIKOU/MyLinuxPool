name: Create Worker

# spec: docs/POOL_RUNTIME_SPEC.md §10.4 — flow: docs/ARCHITECTURE.md §5
#
# Every remote command goes through .github/actions/pool-ssh — this file
# never constructs its own `ssh -J ...` chain. The rest of the flow logic
# (input validation, command building, worker verification) lives in
# scripts/create-worker.sh, sourced by the steps below (docs/LAYOUT.md §3).
#
# Prerequisite this workflow assumes but does not set up itself: the
# `fatesaikou` account on each provider must be able to run `docker`
# without `sudo` (i.e. already in the `docker` group). register-provider.sh
# installs docker.io but doesn't add that group membership, and a bare
# `sudo docker ...` here would hang the same way the old register.sh
# sudo bug did (non-interactive, no TTY, no cached ticket) — see that
# incident for why this isn't worked around with sudo here.

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Provider to host the worker
        required: true
        type: choice
        options:
          - fh-l
          - fh-proxy
      image:
        description: profiles/worker/<image> directory to build
        required: false
        default: default
      name:
        description: Optional worker name (defaults to <provider>-<image>-<run id>)
        required: false

permissions:
  contents: read

env:
  GH_TOKEN: ${{ secrets.GH_POOL_TOKEN }}
  GH_REPO: ${{ github.repository }}
  # Every NODE_* hop's key_secret points at this one Actions identity now
  # (see docs/ARCHITECTURE.md §3) — pool-ssh's agent only ever needs this
  # single key regardless of which chain (gateway or <provider>'s, which
  # also passes through gateway) it's resolving.
  SSH_KEY_ACTIONS: ${{ secrets.SSH_KEY_ACTIONS }}
  # The only way to look up a secret by a name only known at run time
  # (from profile.json) — GitHub Actions has no `secrets[dynamicName]`.
  # Masking still applies: any of these values appearing anywhere in a
  # later log line gets redacted the same as a directly-referenced secret.
  ALL_SECRETS_JSON: ${{ toJSON(secrets) }}

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # image/name feed straight into file paths and remote command text
      # elsewhere below — the raw, not-yet-validated values are read via
      # `env:` here, never inlined directly into this script's own body,
      # since inlining is exactly what this step exists to make safe for
      # every step after it.
      - name: Validate inputs
        shell: bash
        env:
          IMAGE_IN: ${{ inputs.image }}
          NAME_IN: ${{ inputs.name }}
        run: |
          set -euo pipefail
          source scripts/create-worker.sh
          create_worker_validate_name "$IMAGE_IN" image || { echo "::error::invalid 'image' input"; exit 1; }
          create_worker_validate_name "$NAME_IN" name || { echo "::error::invalid 'name' input"; exit 1; }

      - name: Validate image profile
        shell: bash
        run: |
          set -euo pipefail
          dockerfile="profiles/worker/${{ inputs.image }}/Dockerfile"
          profile="profiles/worker/${{ inputs.image }}/profile.json"
          if [[ ! -f "$dockerfile" ]]; then
            echo "::error::${dockerfile} not found"
            exit 1
          fi
          if [[ ! -f "$profile" ]]; then
            echo "::error::${profile} not found — every profiles/worker/<image>/ needs a profile.json (spec §10.2b)"
            exit 1
          fi
          python3 -c 'import json,sys; json.load(open(sys.argv[1]))' "$profile"

      - name: Compute worker identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          source scripts/create-worker.sh
          create_worker_compute_identity "${{ inputs.provider }}" "${{ inputs.image }}" "${{ github.run_id }}" "${{ inputs.name }}" \
            >> "$GITHUB_OUTPUT"

      # profile.json declares "container env name" -> "GitHub secret name"
      # (spec §10.2b) — never a value. Fail loudly (naming exactly which
      # one) if any isn't configured, rather than silently injecting an
      # empty value. Deliberately just a presence check, no values leave
      # this step: a %q-quoted secret value handed across a
      # `${{ steps.X.outputs.Y }}` boundary gets re-interpreted as literal
      # shell source by whatever step reads it (GH Actions substitutes
      # that text before bash parses it), which would mangle anything
      # containing real escapes (a multi-line key, say) and can corrupt
      # $GITHUB_OUTPUT itself. The actual docker run command construction
      # happens inline in "Build docker-run command" below, in the same
      # step that reads $ALL_SECRETS_JSON, so nothing quoted ever crosses
      # a step boundary.
      - name: Validate profile-declared secrets exist
        shell: bash
        run: |
          set -euo pipefail
          source scripts/create-worker.sh
          profile="profiles/worker/${{ inputs.image }}/profile.json"

          mapfile -t missing < <(create_worker_missing_secrets "$profile" "$ALL_SECRETS_JSON")
          if (( ${#missing[@]} > 0 )); then
            echo "::error::${profile} declares secret(s) not configured in this repo: ${missing[*]}"
            exit 1
          fi

      - name: Resolve Gateway
        id: gateway
        shell: bash
        run: |
          set -euo pipefail
          gw_json="$(shared-configs/pool-runtime/files/pool-resolve gateway)"
          {
            echo "ip=$(jq -r '.ip' <<<"$gw_json")"
            echo "user=$(jq -r '.user' <<<"$gw_json")"
            echo "tunnel_user=$(jq -r '.tunnel_user' <<<"$gw_json")"
            echo "port_lo=$(jq -r '.ports.worker[0]' <<<"$gw_json")"
            echo "port_hi=$(jq -r '.ports.worker[1]' <<<"$gw_json")"
          } >> "$GITHUB_OUTPUT"

      - name: Build claim-port command
        id: claim_cmd
        shell: bash
        run: |
          set -euo pipefail
          source scripts/create-worker.sh
          cmd="$(create_worker_build_claim_cmd "${{ steps.gateway.outputs.port_lo }}" "${{ steps.gateway.outputs.port_hi }}" \
            "${{ inputs.provider }}" "${{ inputs.image }}")"
          echo "cmd=${cmd}" >> "$GITHUB_OUTPUT"

      - name: Claim a worker port on the Gateway
        id: claim
        uses: ./.github/actions/pool-ssh
        with:
          node: gateway
          command: ${{ steps.claim_cmd.outputs.cmd }}

      - name: Parse claimed port
        id: port
        shell: bash
        run: |
          set -euo pipefail
          port="$(printf '%s' "${{ steps.claim.outputs.stdout }}" | tr -d '[:space:]')"
          if ! [[ "$port" =~ ^[0-9]+$ ]]; then
            echo "::error::pool-port-alloc did not print a port number (got: '${{ steps.claim.outputs.stdout }}')"
            exit 1
          fi
          echo "port=${port}" >> "$GITHUB_OUTPUT"

      # Providers already keep a repo clone at ~/.mylinuxpool/repo
      # (register-provider.sh) — reuse it as the build context instead of
      # shipping any files there ourselves, pinned to the exact commit
      # this run was dispatched from.
      # `GH_TOKEN=... git fetch` (the previous form here) does nothing on
      # its own — plain git doesn't consult that env var at all, only `gh`
      # does. register-provider.sh configures a global git credential
      # helper that reads ~/.mylinuxpool/gh_token (2026-09-14 incident:
      # fh-proxy, registered after that fix landed, had no fallback and
      # failed outright; fh-l only kept working by accident, via a stale
      # `gh auth login` state predating the switch away from it). This
      # `-c` is a second line of defense: it makes this one invocation
      # work even on a provider that hasn't been re-registered since that
      # fix.
      - name: Build worker image on provider
        id: build
        uses: ./.github/actions/pool-ssh
        with:
          node: ${{ inputs.provider }}
          timeout: "60"
          command: >-
            git -c credential.https://github.com.helper='!f() { echo username=x-access-token; echo "password=$(cat $HOME/.mylinuxpool/gh_token 2>/dev/null)"; }; f' -C ~/.mylinuxpool/repo fetch origin ${{ github.sha }} &&
            git -C ~/.mylinuxpool/repo checkout ${{ github.sha }} &&
            docker build -f ~/.mylinuxpool/repo/profiles/worker/${{ inputs.image }}/Dockerfile -t ${{ steps.identity.outputs.image_tag }} ~/.mylinuxpool/repo

      # Everything that touches a secret value happens inside
      # create_worker_build_run_cmd, in this one step — see the note on
      # "Validate profile-declared secrets exist" above for why. Only this
      # step ever reads the decrypted tunnel key / $FILE_CRYPTO_KEY / the
      # function's own %q-quoted output.
      - name: Build docker-run command
        id: run_cmd
        shell: bash
        env:
          FILE_CRYPTO_KEY: ${{ secrets.FILE_CRYPTO_KEY }}
        run: |
          set -euo pipefail
          source scripts/create-worker.sh
          cmd="$(create_worker_build_run_cmd \
            "${{ steps.identity.outputs.container }}" "${{ steps.identity.outputs.image_tag }}" \
            "${{ steps.port.outputs.port }}" "${{ steps.gateway.outputs.ip }}" \
            "${{ steps.gateway.outputs.tunnel_user }}" "${{ steps.identity.outputs.name }}" \
            "$(scripts/lib/crypto.sh decrypt "$FILE_CRYPTO_KEY" < shared-configs/ssh-tunnel-client/files/id_rsa.crypted)" \
            "shared-configs/ssh-admin/files/authorized_keys.crypted" \
            "$FILE_CRYPTO_KEY" "profiles/worker/${{ inputs.image }}/profile.json" "$ALL_SECRETS_JSON")" \
            || { echo "::error::could not build the docker-run command — see log above"; exit 1; }
          echo "cmd=${cmd}" >> "$GITHUB_OUTPUT"

      - name: Run worker container on provider
        id: run
        uses: ./.github/actions/pool-ssh
        with:
          node: ${{ inputs.provider }}
          command: ${{ steps.run_cmd.outputs.cmd }}

      # pool-port-alloc --claim never learns the container's name (it runs
      # before docker build/run even happen) — record it into the
      # placeholder now so delete-worker.yml can find this claim by name,
      # not just by port.
      - name: Record container name in the port placeholder
        uses: ./.github/actions/pool-ssh
        with:
          node: gateway
          command: >-
            f=~/pool/workers.d/${{ steps.port.outputs.port }}.json &&
            jq --arg c '${{ steps.identity.outputs.container }}' '.container = $c' "$f" > "$f.tmp" &&
            mv "$f.tmp" "$f"

      - name: Verify worker is actually reachable (not just alive)
        shell: bash
        env:
          SSH_KEY_ACTIONS: ${{ secrets.SSH_KEY_ACTIONS }}
        run: |
          set -euo pipefail
          source scripts/create-worker.sh
          eval "$(ssh-agent -s)" >/dev/null
          trap 'ssh-agent -k >/dev/null 2>&1 || true' EXIT
          ssh-add - <<< "$SSH_KEY_ACTIONS" >/dev/null

          if ! create_worker_verify_reachable "${{ steps.gateway.outputs.user }}" "${{ steps.gateway.outputs.ip }}" "${{ steps.port.outputs.port }}"; then
            echo "::error::could not authenticate to the new worker — see log above"
            exit 1
          fi

      - name: Connection command
        shell: bash
        run: |
          echo "Worker '${{ steps.identity.outputs.name }}' is up on ${{ inputs.provider }} (port ${{ steps.port.outputs.port }})."
          echo ""
          echo "Connect with:"
          echo "  ssh -J ${{ steps.gateway.outputs.user }}@${{ steps.gateway.outputs.ip }} -p ${{ steps.port.outputs.port }} worker@127.0.0.1"

      # --- failure handling: never leave an orphaned port claim or a
      # broken, unverified container behind. ---

      # Grab evidence BEFORE cleanup destroys it — the container removal
      # step right after this one is exactly what erased the logs during
      # the 2026-09-14 investigation, forcing a manual reproduction to
      # find "Missing privilege separation directory: /run/sshd" at all.
      - name: On failure, capture container logs before cleanup
        if: failure() && steps.identity.outputs.container != ''
        continue-on-error: true
        uses: ./.github/actions/pool-ssh
        with:
          node: ${{ inputs.provider }}
          command: echo "--- docker logs ${{ steps.identity.outputs.container }} (last 30 lines) ---"; docker logs --tail 30 ${{ steps.identity.outputs.container }} 2>&1 || echo "(no logs — container may never have been created)"

      - name: On failure, remove the (possibly broken) container
        if: failure() && steps.identity.outputs.container != ''
        uses: ./.github/actions/pool-ssh
        with:
          node: ${{ inputs.provider }}
          command: docker rm -f ${{ steps.identity.outputs.container }} >/dev/null 2>&1 || true

      - name: Release claimed port on the Gateway
        if: failure() && steps.port.outputs.port != ''
        uses: ./.github/actions/pool-ssh
        with:
          node: gateway
          command: ~/.mylinuxpool/bin/pool-port-alloc --release ${{ steps.port.outputs.port }}
