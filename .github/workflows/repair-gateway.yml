name: Repair Gateway

# Re-runs scripts/provision-gateway.sh against the Gateway that is live
# right now, instead of a preview machine. Two things need this:
#
#   1. A provision-gateway.sh or shared-configs change only reaches the
#      next machine a rotate produces (RUNBOOK §8). This applies it to the
#      current one without replacing hardware or changing its IP.
#   2. Recovery: if the Gateway's declared state has drifted far enough
#      that you can't log in any more, Actions still can — it holds
#      SSH_KEY_ACTIONS. This is the way back in that doesn't need LISH.
#
# Safe to re-run: provision is idempotent, and NODE_GATEWAY is never
# touched, so nothing here can move the cluster's addressing.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type the Gateway's current IP to confirm you mean this machine
        required: true

permissions:
  contents: read

env:
  GH_TOKEN: ${{ secrets.GH_POOL_TOKEN }}
  GH_REPO: ${{ github.repository }}

concurrency:
  group: rotate-gateway   # shares rotate's lock: never provision mid-rotate
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start ssh-agent, load the Actions key
        shell: bash
        env:
          SSH_KEY_ACTIONS: ${{ secrets.SSH_KEY_ACTIONS }}
        run: |
          set -euo pipefail
          eval "$(ssh-agent -s)" >/dev/null
          echo "SSH_AUTH_SOCK=${SSH_AUTH_SOCK}" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=${SSH_AGENT_PID}" >> "$GITHUB_ENV"
          ssh-add - <<< "$SSH_KEY_ACTIONS"

      - name: Resolve the live Gateway and check the confirmation
        id: gw
        shell: bash
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          ip="$(shared-configs/pool-runtime/files/pool-resolve gateway --refresh --field .ip)"
          gen="$(shared-configs/pool-runtime/files/pool-resolve gateway --field .generation)"
          echo "live Gateway: ${ip} (generation ${gen})"
          if [[ "$CONFIRM" != "$ip" ]]; then
            echo "::error::confirmation '${CONFIRM}' does not match the live Gateway ${ip}"
            exit 1
          fi
          echo "ip=${ip}" >> "$GITHUB_OUTPUT"
          # The Gateway's own SSH port. Anything dialling it after this point
          # must use it, or it breaks the moment 22 stops listening.
          echo "ssh_port=$(shared-configs/pool-runtime/files/pool-resolve gateway --field .port 2>/dev/null || echo 22)" >> "$GITHUB_OUTPUT"
          echo "generation=${gen}" >> "$GITHUB_OUTPUT"
          echo "host_key=$(shared-configs/pool-runtime/files/pool-resolve gateway --field .host_key 2>/dev/null)" >> "$GITHUB_OUTPUT"

      - name: Deploy shared-configs + scripts to the Gateway
        shell: bash
        env:
          GW_IP: ${{ steps.gw.outputs.ip }}
        run: |
          set -euo pipefail
          source scripts/rotate-gateway.sh
          rotate_deploy_repo_bundle fatesaikou "$GW_IP"

      - name: Run provision-gateway.sh
        shell: bash
        env:
          FILE_CRYPTO_KEY: ${{ secrets.FILE_CRYPTO_KEY }}
          GW_IP: ${{ steps.gw.outputs.ip }}
        run: |
          set -euo pipefail
          source scripts/rotate-gateway.sh
          trusted_ips="$(gh variable get POOL_TRUSTED_IPS --repo "$GH_REPO")"
          # Which ports sshd should listen on comes from NODE_GATEWAY, the
          # same variable clients read the port from, so the machine and its
          # clients can never disagree. ssh_listen_ports is the migration
          # superset; without it the machine listens on exactly .port.
          gw_json="$(gh api "repos/${GH_REPO}/actions/variables/NODE_GATEWAY" --jq .value)"
          listen_ports="$(printf '%s' "$gw_json" \
            | jq -r '(.ssh_listen_ports // [(.port // 22)]) | map(tostring) | join(" ")')"
          rotate_run_provision fatesaikou "$GW_IP" "$trusted_ips" "$FILE_CRYPTO_KEY" "$listen_ports"

      # The state cache is part of provisioning, not an afterthought: a
      # Gateway without it serves nothing to the nodes that now prefer it.
      # A failed push fails the repair, per docs/STATE_CONTRACT.md §4.
      - name: Push the state cache
        uses: ./.github/actions/push-state
        with:
          gateway-ip: ${{ steps.gw.outputs.ip }}
          gateway-port: ${{ steps.gw.outputs.ssh_port }}
          host-key: ${{ steps.gw.outputs.host_key }}
          source: repair-gateway#${{ github.run_id }}

      - name: Report
        if: always()
        shell: bash
        env:
          GW_IP: ${{ steps.gw.outputs.ip }}
          GEN: ${{ steps.gw.outputs.generation }}
        run: |
          echo "Re-provisioned Gateway ${GW_IP} (generation ${GEN}). NODE_GATEWAY unchanged."

      - name: Stop ssh-agent
        if: always()
        shell: bash
        run: ssh-agent -k >/dev/null 2>&1 || true
