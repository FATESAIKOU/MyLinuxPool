name: Delete linode

on:
  workflow_call:
    inputs:
      label:
        type: string
        description: instance label
        required: true
        default: fws
      
jobs:
  delete_linode:
    name: delete linode
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4

    - name: Install the Linode CLI
      uses: linode/action-linode-cli@v1
      with:
        token: ${{ secrets.LINODE_TOKEN }}

    - name: Delete a Linode instance
      run: |
        LABEL="${{ inputs.label }}"

        echo "[Debug]: Start delete LABEL=$LABEL" # Debug
        echo "[Debug]: "$(linode-cli linodes list --json | jq -r ".[] | select(.label == \"fws\") | .id") # Debug
        echo "[Debug]: "$(linode-cli linodes list --json | jq -r ".[] | select(.label == \"fws-preview\") | .id") # Debug

        linode_id=$(linode-cli linodes list --json | jq -r ".[] | select(.label == \"$LABEL\") | .id")

        echo "[Debug]: linode_id=$linode_id" # Debug
        # if linode_id is not empty, delete the linode
        if [ -n "$linode_id" ]; then
          linode-cli linodes rm "$linode_id"
        else
          echo "No Linode found with label $LABEL"
        fi
