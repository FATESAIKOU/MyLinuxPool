name: push-state
description: >-
  Push the state cache to a Gateway. Reads every NODE_* variable plus
  POOL_WORKERS from GitHub, merges them with the Gateway's current
  state.json (for the serial), validates the payload against the state
  contract, and installs it atomically at /var/lib/mylinuxpool/state.json.
  A failed push fails the step — readers trust this cache unconditionally,
  so a stale half-written copy must never look like success
  (docs/STATE_CONTRACT.md §2/§4).

inputs:
  gateway-ip:
    description: IP of the Gateway machine to push to
    required: true
  gateway-port:
    description: >-
      The Gateway's SSH port (NODE_GATEWAY.port). Defaults to 22 so a caller
      that predates the port being movable still works — but a caller that
      does not pass it will fail the moment the Gateway stops listening on
      22, which is exactly what happened on 2026-09-20.
    required: false
    default: "22"
  gateway-user:
    description: SSH user on the Gateway (must be able to sudo to root)
    required: false
    default: fatesaikou
  host-key:
    description: The Gateway's ssh host key line (e.g. "ssh-ed25519 AAAA..."); empty = trust-on-first-use
    required: false
    default: ""
  source:
    description: "<workflow>#<run_id> written into the state.json source field"
    required: true
  ssh-key:
    description: >-
      Private key for <gateway-user> on the Gateway. When set, run.sh starts
      a temporary ssh-agent, loads the key from stdin (never written to
      disk, never in a log or command line) and kills the agent when done.
      When empty, run.sh uses the caller's existing ssh-agent (e.g. a
      workflow's own "Start ssh-agent" step). Providing it makes the action
      self-contained — no hidden dependency on what the caller set up.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Push state cache
      shell: bash
      env:
        PUSH_GATEWAY_IP: ${{ inputs.gateway-ip }}
        PUSH_GATEWAY_PORT: ${{ inputs.gateway-port }}
        PUSH_GATEWAY_USER: ${{ inputs.gateway-user }}
        PUSH_HOST_KEY: ${{ inputs.host-key }}
        PUSH_SOURCE: ${{ inputs.source }}
        PUSH_SSH_KEY: ${{ inputs.ssh-key }}
        GH_TOKEN: ${{ env.GH_TOKEN }}
        GH_REPO: ${{ github.repository }}
      run: ${{ github.action_path }}/run.sh
