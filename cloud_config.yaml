#cloud-config
users:
- name: fatesaikou
  groups: sudo
  sudo: ALL=(ALL) NOPASSWD:ALL
  shell: /bin/bash
  ssh_authorized_keys: ${FATESAIKOU_KEYS}
  lock_passwd: false
  plain_text_passwd: ${FATESAIKOU_TMP_PASS}
- name: sshproxy
  shell: /bin/bash
  ssh_authorized_keys: ${SSHPROXY_KEYS}
  lock_passwd: false
  plain_text_passwd: ${SSHPROXY_TMP_PASS}

package_update: true
package_upgrade: true

packages:
- vim
- tmux
- git
- rclone
- python3
- nodejs