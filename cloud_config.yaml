#cloud-config
users:
- name: fatesaikou
  groups: sudo
  sudo: ALL=(ALL) NOPASSWD:ALL
  shell: /bin/bash
  ssh_authorized_keys: ${FATESAIKOU_KEYS}
- name: sshproxy
  shell: /bin/bash
  ssh_authorized_keys: ${SSHPROXY_KEYS}

package_update: true
package_upgrade: true

packages:
- vim
- tmux
- git
- rclone
- python3
- nodejs

runcmd:
- sed -i '/PermitRootLogin/d' /etc/ssh/sshd_config
- echo "PermitRootLogin no" >> /etc/ssh/sshd_config
- systemctl restart sshd
- echo '${FATESAIKOU_BASHRC_BASE64}' | base64 -d > /home/fatesaikou/.bashrc
- echo '${FATESAIKOU_TMUXCONF_BASE64}' | base64 -d > /home/fatesaikou/.tmux.conf