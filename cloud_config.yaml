#cloud-config
users:
- name: fatesaikou
  groups: sudo
  sudo: ALL=(ALL) NOPASSWD:ALL
  shell: /bin/bash
  lock_passwd: false
  plain_text_passwd: ${FATESAIKOU_TMP_PASS}
- name: sshproxy
  shell: /bin/bash
  lock_passwd: false
  plain_text_passwd: ${SSHPROXY_TMP_PASS}

package_update: true
package_upgrade: true

packages:
- gcc
- make
- curl
- unzip
- vim
- tmux
- git
- rclone
- python3
- python3-pip
- python3-pytest
- nodejs
# Dependencies for playwright
- libatk1.0-0t64
- libatk-bridge2.0-0t64
- libcups2t64
- libatspi2.0-0t64
- libxcomposite1
- libxdamage1
- libxfixes3
- libxrandr2
- libgbm1
- libpango-1.0-0
- libcairo2
- libasound2t64